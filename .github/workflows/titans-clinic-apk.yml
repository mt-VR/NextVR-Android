name: Titans Clinic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'titans-clinic-apk/**'
      - 'game/**'
      - 'titans-clinic.html'
      - '.github/workflows/titans-clinic-apk.yml'

permissions:
  contents: write   # o CI commita o APK na própria branch (canal de entrega)

jobs:
  build:
    name: Build game APK (WebView wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release APK
        run: ./gradlew -p titans-clinic-apk assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          cp titans-clinic-apk/build/outputs/apk/release/titans-clinic-apk-release.apk titans-clinic.apk
          ls -la titans-clinic.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: titans-clinic-apk
          path: titans-clinic.apk
          retention-days: 30

      # Entrega via git: o .gitignore ignora *.apk, então o CI faz add -f e
      # commita o binário na branch que disparou o run (canal baixável depois).
      - name: Publish APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f titans-clinic.apk
          if git diff --cached --quiet; then
            echo "APK identico ao anterior, nada a commitar"
          else
            git commit -m "chore(apk): titans-clinic build de ${GITHUB_SHA::8}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
