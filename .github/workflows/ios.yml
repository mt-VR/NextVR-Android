name: iOS CI

# Build 95 — o .ipa do ATMO XR.
#
# Este workflow NÃO assina o app: não há certificado Apple no repositório, e um .ipa assinado à mão
# por um robô não instalaria em ninguém. O que ele entrega é o pacote COMPILADO (arm64, Release), que
# se instala em qualquer iPhone com o seu Apple ID por Sideloadly, AltStore ou Xcode — e que o dia em
# que houver uma conta Apple Developer vira TestFlight com duas linhas a mais (assinatura automática).
on:
  workflow_dispatch:
  push:
    branches: ["arena/98e128f7-nextvr-android"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "web/src/**"
      - "web/index.html"
      - "web/build.mjs"

permissions:
  contents: write

jobs:
  ipa:
    name: Build the ATMO XR iPhone app
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Bundle the UI and copy it into the iOS app
        run: |
          set -e
          npm ci
          npm run build:ui
          bash ios/Scripts/sync-ui.sh
          ls ios/ATMOXR/Resources/ui | head -20

      # A mesma checagem estática que roda no Android: os nomes da ponte, o segredo da Key, o plist.
      - name: Validate the iOS project
        run: node --test tests/build-95-ios.test.mjs

      # O runner muda de imagem com o tempo: usar o Xcode mais novo disponível evita "Unable to read
      # project" por diferença de formato do project.pbxproj.
      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          echo "::notice::xcodebuild $(xcodebuild -version | tr '\n' ' ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          set +e
          cd ios
          echo "::notice::xcodegen $(xcodegen --version 2>&1 | tr '\n' ' ')"
          xcodegen generate
          echo "::notice::projeto gerado: $(grep -m1 objectVersion ATMOXR.xcodeproj/project.pbxproj)"
          ls -la . | head -20
          ls -la ATMOXR.xcodeproj || echo "::error::ATMOXR.xcodeproj nao existe"
          ls -la ATMOXR.xcodeproj/project.pbxproj || echo "::error::project.pbxproj nao existe"
          head -c 400 ATMOXR.xcodeproj/project.pbxproj
          echo ""
          xcodebuild -version
          xcodebuild -list -project ATMOXR.xcodeproj > /tmp/xclist.log 2>&1
          LIST=$?
          head -20 /tmp/xclist.log
          echo "::notice::xcodebuild -list status $LIST"
          if [ $LIST -ne 0 ]; then
            tail -3 /tmp/xclist.log | while IFS= read -r line; do echo "::error::[list] $(printf '%s' "$line" | cut -c1-400)"; done
          fi

      # O log do runner do macOS não é legível pela API (o results-receiver devolve EOF), então os
      # erros saem como ANOTAÇÕES do check — e só eles: o GitHub corta em 10 anotações por check, e um
      # despejo das primeiras linhas do log já gastou essa cota uma vez.
      - name: Build the app (unsigned, arm64)
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/ios" || { echo "::error::nao consegui entrar em ios/"; exit 1; }
          report() {
            echo "::error::$1 (status $2)"
            grep -nE "error:|fatal error" "$3" | head -n 6 |
              while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-420)"; done
          }
          # 1) Compilar primeiro para o simulador: não tem assinatura nenhuma no caminho, então o que
          #    aparecer aqui é erro de código (Swift/plist), não de assinatura.
          xcodebuild -project ATMOXR.xcodeproj -scheme ATMOXR -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim build > /tmp/sim.log 2>&1
          SIM=$?
          if [ $SIM -ne 0 ]; then
            echo "::error::compilacao para o simulador falhou"
            grep -nE "error:|fatal error" /tmp/sim.log | head -n 6 |
              while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-420)"; done
            cat /tmp/sim.log > /tmp/xcodebuild.log
            exit 1
          fi
          echo "::notice::compilou para o simulador (iOS $(xcrun --sdk iphonesimulator --show-sdk-version))"
          # 2) Agora o pacote de verdade (arm64, iphoneos), sem assinatura.
          xcodebuild -project ATMOXR.xcodeproj -scheme ATMOXR -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            report "xcodebuild (device) falhou" "$STATUS" /tmp/xcodebuild.log
            exit 1
          fi
          echo "::notice::app arm64 compilado sem assinatura"

      - name: Package the unsigned .ipa
        run: |
          set -e
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          test -f "$APP/ui/index.html"
          test -f "$APP/bridge.js"
          rm -rf dist && mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry ATMOXR.ipa Payload
          SIZE=$(stat -f %z ATMOXR.ipa)
          MD5=$(md5 -q ATMOXR.ipa)
          printf 'ATMOXR IPA built by iOS CI run %s from commit %s\nsize: %s bytes\nmd5: %s\nsigned: no (install with Sideloadly/AltStore using your Apple ID)\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SIZE" "$MD5" > build.txt
          cat build.txt

      - name: Publish the .ipa to the ipa-dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/dist"
          rm -rf /tmp/ipa-dist && mkdir -p /tmp/ipa-dist/dist && cd /tmp/ipa-dist
          git init -q -b ipa-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/dist/ATMOXR.ipa" dist/ATMOXR.ipa
          cp "$GITHUB_WORKSPACE/dist/build.txt" dist/build.txt
          git add dist
          git commit -qm "ATMOXR IPA from iOS CI run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            if git push --force origin ipa-dist; then break; fi
            echo "ipa-dist push failed (attempt $attempt); retrying"
            sleep $((attempt * 4))
          done
          echo "IPA published: branch ipa-dist, path dist/ATMOXR.ipa"

      # Canal de diagnóstico: o log do runner do macOS não é legível pela API (o results-receiver
      # devolve EOF), então numa falha o log vai para a branch ipa-debug — de onde ele pode ser lido
      # pelo conteúdo do repositório, sem depender do serviço de logs.
      - name: Publish the build log on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -f /tmp/xcodebuild.log || echo "(sem log)" > /tmp/xcodebuild.log
          test -f /tmp/sim.log && cp /tmp/sim.log sim.log || true
          rm -rf /tmp/ipa-debug && mkdir -p /tmp/ipa-debug && cd /tmp/ipa-debug
          git init -q -b ipa-debug
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/xcodebuild.log xcodebuild.log
          printf 'run %s commit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > status.txt
          git add .
          git commit -qm "iOS build log from run $GITHUB_RUN_ID"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ipa-debug || echo "push do log falhou"

      - name: Upload the build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload the .ipa
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ATMOXR-ipa
          path: dist/ATMOXR.ipa
          if-no-files-found: error
          retention-days: 30
