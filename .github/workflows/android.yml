name: Android CI (MetaMR PotatoVR)

on:
  push:
    branches: [ "arena/7e43774f-nextvr-android", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build MetaMR PotatoVR debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prune old CI artifacts (storage quota guard)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=3
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="metamr-potatovr-debug-apk" or .name=="unit-test-reports") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +$((keep + 1)) | awk '{print $2}' > /tmp/old-artifacts.txt || true
          xargs -r -P 4 -I{} gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}" < /tmp/old-artifacts.txt || true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate HTML/JS base, Java refs and bundle offline assets
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          npm ci
          python3 -m pip install --quiet --break-system-packages javalang 2>/dev/null || \
            python3 -m pip install --quiet --user javalang 2>/dev/null || true
          python3 tools/check-java-refs.py --self-test
          python3 tools/check-java-refs.py
          npm run build:ui
          npm test
          git diff --exit-code -- app/src/main/assets/index.html) 2>&1 | tee /tmp/build.log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MetaMR debug APK and run JVM unit tests
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Verify packaged assets and debug signature
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          echo "Built APK: $APK ($(stat -c %s "$APK") bytes)"

          for ENTRY in \
            assets/index.html \
            assets/vendor/three/three.min.js \
            assets/vendor/three/CSS3DRenderer.js \
            assets/vendor/mediapipe/camera_utils/camera_utils.js \
            assets/vendor/mediapipe/hands/hands.js \
            assets/vendor/mediapipe/hands/hand_landmark_lite.tflite \
            assets/vendor/mediapipe/hands/hands_solution_simd_wasm_bin.wasm \
            classes.dex \
            AndroidManifest.xml; do
            echo "Checking $ENTRY"
            unzip -Z1 "$APK" | grep -Fx "$ENTRY"
          done

          FP=94b3534f902bb783d9cd5859978106f2687016e3127c239a397ffc3ea7b2adbf
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tr -d ':' | grep -qi "$FP"
            echo "APK conferido pelo apksigner com a chave fixa do repositório."
          fi

          mkdir -p /tmp/apk-upload
          cp "$APK" /tmp/apk-upload/MetaMR-PotatoVR-debug.apk
          ) 2>&1 | tee -a /tmp/build.log

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.ui.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && 'success' || 'failure' }}
        run: |
          if [ ! -f /tmp/build.log ]; then echo "no build log captured" > /tmp/build.log; fi
          tail -c 60000 /tmp/build.log | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' > /tmp/build-tail.txt
          case "$OUTCOME" in
            success) CONCLUSION=success ;;
            *) CONCLUSION=failure ;;
          esac
          jq -n --rawfile t /tmp/build-tail.txt \
                --arg c "$CONCLUSION" \
                --arg sha "${{ github.sha }}" \
                '{name: "gradle-diagnostics", head_sha: $sha, status: "completed",
                  conclusion: $c,
                  output: {title: "Gradle build log (tail)", summary: "Build output for MetaMR PotatoVR APK", text: $t}}' \
            > /tmp/payload.json
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/check-runs" --input /tmp/payload.json; then
              break
            fi
            sleep $((attempt * 4))
          done || true

      - name: Fail if any validation failed
        if: steps.ui.outcome != 'success' || steps.build.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload MetaMR PotatoVR APK
        uses: actions/upload-artifact@v4
        with:
          name: metamr-potatovr-debug-apk
          path: /tmp/apk-upload/MetaMR-PotatoVR-debug.apk
          if-no-files-found: error
          retention-days: 30
