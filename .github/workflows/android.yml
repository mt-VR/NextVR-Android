name: Android CI

on:
  push:
    branches: [ "arena/8b022eaa-nextvr-android", "arena/c4d7e93b-nextvr-android", "arena/b89c3f64-nextvr-android", "arena/b491b5e8-nextvr-android", "arena/d9f930f3-nextvr-android", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build NextVR debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate and bundle reference UI
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          npm ci
          # Reference check of the Android sources (no JDK on this step): it catches renamed methods,
          # changed arities, accessed fields that do not exist and AIDL transactions without an
          # implementation. Installed here because the runner image does not carry javalang; if the
          # install fails the script says so and skips instead of pretending to have checked.
          python3 -m pip install --quiet --break-system-packages javalang 2>/dev/null || \
            python3 -m pip install --quiet --user javalang 2>/dev/null || true
          # First the tool's own synthetic cases: a rule that quietly stopped working would report a
          # clean tree and let the next compile error through.
          python3 tools/check-java-refs.py --self-test
          python3 tools/check-java-refs.py
          npm test
          npm run build:ui
          git diff --exit-code -- nextvr-android/src/main/assets/ui) 2>&1 | tee /tmp/build.log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4


      - name: Show runner Android toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "no ndk preinstalled"
          ls "$ANDROID_HOME/cmake" 2>/dev/null || echo "no cmake preinstalled"
          which sdkmanager || true
        continue-on-error: true

      - name: Install NDK and CMake
        run: |
          set -x
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" || \
            sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" --channel=0
          sdkmanager --list_installed || true
        continue-on-error: true

      - name: Build Cardboard SDK and NextVR
        id: build
        run: |
          set -o pipefail
          ./gradlew :nextvr-android:testDebugUnitTest :nextvr-android:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/build.log
        continue-on-error: true

      - name: Verify native camera and detector libraries in both APK ABIs
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          APK=$(find nextvr-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          NM="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          unzip -Z1 "$APK" | grep '^lib/'
          for ABI in armeabi-v7a arm64-v8a; do
            for LIB in libnextvr_jni.so libmediapipe_tasks_jni.so libtensorflowlite_jni.so; do
              echo "Checking $ABI/$LIB"
              unzip -Z1 "$APK" | grep -Fx "lib/$ABI/$LIB"
            done
            unzip -p "$APK" "lib/$ABI/libnextvr_jni.so" > "/tmp/nextvr-$ABI.so"
            "$NM" -D "/tmp/nextvr-$ABI.so" | grep 'Java_com_nextvr_app_PassthroughCamera_nativeYuvToArgb'
          done
          ) 2>&1 | tee -a /tmp/build.log

      # A assinatura de depuração vem do repositório (signing/debug.keystore, declarado no
      # build.gradle do módulo). Sem isso, cada runner gera uma chave nova e a rodada nova NÃO
      # instala por cima da anterior ("App not installed"). Aqui o APK montado é conferido contra a
      # impressão digital da chave do repositório: se o Gradle voltar a assinar sozinho, o CI falha
      # no lugar de entregar um APK que não atualiza.
      - name: Verify debug signature is the repository key
        id: sign
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          FP=94b3534f902bb783d9cd5859978106f2687016e3127c239a397ffc3ea7b2adbf
          # O relatório do próprio Gradle diz com qual chave a variante debug sai assinada.
          ./gradlew :nextvr-android:signingReport --no-daemon > /tmp/sign.txt 2>&1 || true
          cat /tmp/sign.txt
          tr -d ':' < /tmp/sign.txt | grep -qi "$FP"
          echo "Variante debug assinada com a chave de depuração do repositório"
          # Reforço: a assinatura do APK montado, quando o apksigner está disponível.
          APK=$(find nextvr-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tr -d ':' | grep -qi "$FP"
            echo "APK conferido pelo apksigner"
          else
            echo "apksigner indisponível neste runner; a conferência acima já cobre a assinatura"
          fi
          ) 2>&1 | tee -a /tmp/build.log

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.ui.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.sign.outcome == 'success' && 'success' || 'failure' }}
        run: |
          if [ ! -f /tmp/build.log ]; then echo "no build log captured" > /tmp/build.log; fi
          python3 -c 'import glob,xml.etree.ElementTree as E; [(print("JVM",p,E.parse(p).getroot().attrib)) for p in glob.glob("nextvr-android/build/test-results/testDebugUnitTest/TEST-*.xml")]' >> /tmp/build.log
          # Strip ANSI colour codes, keep the last 60k characters (check-run limit).
          tail -c 60000 /tmp/build.log | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' > /tmp/build-tail.txt
          case "$OUTCOME" in
            success) CONCLUSION=success ;;
            *) CONCLUSION=failure ;;
          esac
          jq -n --rawfile t /tmp/build-tail.txt \
                --arg c "$CONCLUSION" \
                --arg sha "${{ github.sha }}" \
                '{name: "gradle-diagnostics", head_sha: $sha, status: "completed",
                  conclusion: $c,
                  output: {title: "Gradle build log (tail)", summary: "Build output for this commit", text: $t}}' \
            > /tmp/payload.json
          # The push and the pull_request runs of the same commit post at the same moment, and the
          # second one used to die on the API's secondary rate limit — turning a fully green build
          # into a red job with nothing wrong in it. Retry instead of failing the job for that.
          uploaded=0
          for attempt in 1 2 3 4; do
            if gh api -X POST "repos/${{ github.repository }}/check-runs" --input /tmp/payload.json; then
              uploaded=1
              break
            fi
            echo "check-run upload failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          [ "$uploaded" = "1" ]

      - name: Fail if any validation failed
        if: steps.ui.outcome != 'success' || steps.build.outcome != 'success' || steps.verify.outcome != 'success' || steps.sign.outcome != 'success'
        run: exit 1

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: nextvr-android/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextvr-debug-apk
          path: nextvr-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Publishes the built debug APK to the disposable `apk-dist` branch so the file can be
  # fetched with plain git (the Actions artifact download redirects to a blob host that
  # some restricted environments cannot reach). The branch carries only dist/app-debug.apk.
  publish-apk:
    name: Publish debug APK to apk-dist branch
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nextvr-debug-apk
          path: apk

      - name: Push APK to apk-dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find "$GITHUB_WORKSPACE/apk" -name '*.apk' -print -quit)
          test -n "$APK"
          rm -rf /tmp/apk-dist && mkdir -p /tmp/apk-dist/dist && cd /tmp/apk-dist
          git init -q -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$APK" dist/app-debug.apk
          # O APK se identifica: o arquivo ao lado dele diz de que run e de que commit ele veio, com
          # tamanho e md5, para conferir o download sem depender de um número escrito na mão em lugar
          # nenhum (a documentação aponta para este arquivo).
          SIZE=$(stat -c %s "$APK")
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          printf 'Debug APK built by Android CI run %s from commit %s\nsize: %s bytes\nmd5: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SIZE" "$MD5" > dist/build.txt
          cat dist/build.txt
          git add dist
          git commit -qm "Debug APK from CI run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin apk-dist
          echo "APK published: branch apk-dist, path dist/app-debug.apk"
