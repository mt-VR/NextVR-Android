name: Android CI

on:
  push:
    branches: [ "arena/98e128f7-nextvr-android", "arena/80a6e3eb-nextvr-android", "arena/8b022eaa-nextvr-android", "arena/c4d7e93b-nextvr-android", "arena/b89c3f64-nextvr-android", "arena/b491b5e8-nextvr-android", "arena/d9f930f3-nextvr-android", "arena/12af1f16-nextvr-android", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build NextVR debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Declarar `permissions` substitui o conjunto default inteiro: sem `checks: write`
    # o passo "Publish build diagnostics" tomava 403 ao criar o check-run e o run
    # falhava com exit 1 mesmo com o build verde.
    permissions:
      contents: write     # publicar o APK na branch apk-dist
      actions: write      # apagar artefatos antigos (cota de storage)
      checks: write       # criar/atualizar o check-run gradle-diagnostics
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        continue-on-error: true
        run: |
          # Runner às vezes enche com ferramentas pré-instaladas que não usamos.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/local/.ghcup 2>/dev/null || true
          # NÃO apagar /usr/local/lib/android: é onde o setup-java e o SDK do Android vivem.
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Python*/*-arm* 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo apt-get clean || true
          docker system prune -af 2>/dev/null || true
          df -h /
      - name: Prune old CI artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O free tier guarda 500 MB de artefatos. Cada build subia ~40 MB com
          # retencao de 30 dias; a cota estourou, o upload falhou e derrubou o run.
          # Apaga os antigos antes de subir os novos.
          set -x
          keep=2
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="nextvr-debug-apk" or .name=="native-test-reports") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +$((keep + 1)) | awk '{print $2}' > /tmp/old-artifacts.txt || true
          echo "artifacts to delete: $(wc -l < /tmp/old-artifacts.txt)"
          xargs -r -P 8 -I{} gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}" < /tmp/old-artifacts.txt || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts | length' || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate and bundle reference UI
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          npm ci
          # Reference check of the Android sources (no JDK on this step): it catches renamed methods,
          # changed arities, accessed fields that do not exist and AIDL transactions without an
          # implementation. Installed here because the runner image does not carry javalang; if the
          # install fails the script says so and skips instead of pretending to have checked.
          python3 -m pip install --quiet --break-system-packages javalang 2>/dev/null || \
            python3 -m pip install --quiet --user javalang 2>/dev/null || true
          # First the tool's own synthetic cases: a rule that quietly stopped working would report a
          # clean tree and let the next compile error through.
          python3 tools/check-java-refs.py --self-test
          python3 tools/check-java-refs.py
          echo "ui: referências Java ok"
          npm test
          echo "ui: suíte de testes ok"
          npm run build:ui
          echo "ui: bundle gerado"
          if ! git diff --exit-code -- nextvr-android/src/main/assets/ui; then
            echo "ui: o bundle commitado está DIFERENTE do que o build gera (rode node web/build.mjs)"
            exit 1
          fi
          echo "ui: bundle commitado está em dia") 2>&1 | tee /tmp/ui.log | tee -a /tmp/build.log

      # Quando a etapa da interface falha, o MOTIVO tem de sair como ANOTAÇÃO: o log do job é
      # servido por um blob que não abre em todo lugar, e "Process completed with exit code 1" não
      # diz nada. Este passo roda DEPOIS (o `bash -e` do passo anterior derruba ele mesmo), e lê o
      # /tmp/ui.log que o `tee` já gravou até o ponto da falha.
      - name: Diagnóstico da etapa da interface
        if: steps.ui.outcome != 'success'
        continue-on-error: true
        run: |
          # O bloco de erro do node --test (a asserção que caiu, com a mensagem) vem logo DEPOIS
          # da linha "not ok": é ele que diz o que consertar.
          BODY=$(sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/ui.log \
            | awk '/^not ok/{show=28} show>0{print;show--}' \
            | head -30 | cut -c1-500 \
            | awk 'NR>1{printf "%%0A"} {printf "%s",$0}')
          echo "::error::passo UI falhou: ${BODY:-<sem saída em /tmp/ui.log>}"
          TAIL=$(tail -6 /tmp/ui.log | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r//g' \
            | cut -c1-500 | awk 'NR>1{printf "%%0A"} {printf "%s",$0}')
          echo "::error::fim da saída: ${TAIL:-<vazio>}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6


      - name: Show runner Android toolchain
        run: |
          set -x
          # `bash -e` derruba o passo no primeiro comando que falhar: tudo aqui e diagnostico,
          # entao nada pode sair diferente de zero (era daqui que vinha um exit 127).
          java -version || echo "java not on PATH"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$SDK" 2>/dev/null || echo "no Android SDK directory"
          ls "$SDK/ndk" 2>/dev/null || echo "no ndk preinstalled"
          ls "$SDK/cmake" 2>/dev/null || echo "no cmake preinstalled"
          command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null \
            || echo "no sdkmanager on this runner"
        continue-on-error: true

      # O runner nao tem o `sdkmanager` no PATH (ele mora em cmdline-tools/*/bin). Os passos `run:`
      # rodam com `bash -e`, entao `sdkmanager ... || sdkmanager ...` abortava o passo com exit 127
      # ANTES da linha com `|| true`, e o Actions publicava a anotacao vermelha "Process completed
      # with exit code 127" em toda rodada -- mesmo com o NDK e o CMake ja instalados na imagem.
      # Agora o binario e localizado de verdade, a instalacao so roda quando falta algo, e nenhuma
      # falha derruba o passo: quem garante o toolchain e o build Gradle logo abaixo.
      - name: Install NDK and CMake
        run: |
          set -x
          NDK_VERSION=29.0.14206865
          CMAKE_VERSION=3.22.1
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK" ]; then
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          echo "sdkmanager=${SDKMANAGER:-<none>}"
          if [ -d "$SDK/ndk/$NDK_VERSION" ] && [ -d "$SDK/cmake/$CMAKE_VERSION" ]; then
            echo "NDK $NDK_VERSION and CMake $CMAKE_VERSION are already installed"
          elif [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager: relying on the preinstalled toolchain"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" \
              || echo "sdkmanager install failed; continuing with the preinstalled toolchain"
          fi
          ls "$SDK/ndk" "$SDK/cmake" 2>/dev/null || true
        continue-on-error: true

      - name: Build Cardboard SDK and NextVR
        id: build
        run: |
          set -o pipefail
          ./gradlew :nextvr-android:testDebugUnitTest :nextvr-android:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/build.log
        continue-on-error: true

      - name: Verify native camera and detector libraries in both APK ABIs
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          APK=$(find nextvr-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          NM="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          unzip -Z1 "$APK" | grep '^lib/'
          for ABI in armeabi-v7a arm64-v8a; do
            for LIB in libnextvr_jni.so libmediapipe_tasks_jni.so libtensorflowlite_jni.so; do
              echo "Checking $ABI/$LIB"
              unzip -Z1 "$APK" | grep -Fx "lib/$ABI/$LIB"
            done
            unzip -p "$APK" "lib/$ABI/libnextvr_jni.so" > "/tmp/nextvr-$ABI.so"
            "$NM" -D "/tmp/nextvr-$ABI.so" | grep 'Java_com_nextvr_app_PassthroughCamera_nativeYuvToArgb'
          done
          ) 2>&1 | tee -a /tmp/build.log

      # A assinatura de depuração vem do repositório (signing/debug.keystore, declarado no
      # build.gradle do módulo). Sem isso, cada runner gera uma chave nova e a rodada nova NÃO
      # instala por cima da anterior ("App not installed"). Aqui o APK montado é conferido contra a
      # impressão digital da chave do repositório: se o Gradle voltar a assinar sozinho, o CI falha
      # no lugar de entregar um APK que não atualiza.
      - name: Verify debug signature is the repository key
        id: sign
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          (set -e
          FP=94b3534f902bb783d9cd5859978106f2687016e3127c239a397ffc3ea7b2adbf
          # Sem cano entre `tr` e `grep -q`: o grep sai no primeiro acerto, o tr leva SIGPIPE e, com
          # `pipefail`, a rodada inteira falhava sem dizer nada (foi assim que uma entrega de APK
          # ficou vermelha com todos os testes verdes). Arquivo intermediário e grep com -f de nada:
          # nada fecha o cano antes da hora.
          # O relatório do próprio Gradle diz com qual chave a variante debug sai assinada.
          ./gradlew :nextvr-android:signingReport --no-daemon > /tmp/sign.txt 2>&1 || true
          cat /tmp/sign.txt
          tr -d ':' < /tmp/sign.txt > /tmp/sign-fp.txt 2>/dev/null || cp /tmp/sign.txt /tmp/sign-fp.txt
          if ! grep -qi "$FP" /tmp/sign-fp.txt; then
            echo "o signingReport NÃO mostra a chave do repositório ($FP)"
            exit 1
          fi
          echo "Variante debug assinada com a chave de depuração do repositório"
          # Reforço: a assinatura do APK montado, quando o apksigner está disponível.
          APK=$(find nextvr-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          echo "APK montado: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          echo "apksigner: ${APKSIGNER:-<nenhum>}"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certs.txt 2>&1 || true
            cat /tmp/apk-certs.txt
            tr -d ':' < /tmp/apk-certs.txt > /tmp/apk-fp.txt 2>/dev/null || cp /tmp/apk-certs.txt /tmp/apk-fp.txt
            if ! grep -qi "$FP" /tmp/apk-fp.txt; then
              echo "o apksigner não achou a chave do repositório no APK montado"
              exit 1
            fi
            echo "APK conferido pelo apksigner"
          else
            echo "apksigner indisponível neste runner; a conferência acima já cobre a assinatura"
          fi
          ) 2>&1 | tee -a /tmp/build.log

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.ui.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.sign.outcome == 'success' && 'success' || 'failure' }}
        run: |
          if [ ! -f /tmp/build.log ]; then echo "no build log captured" > /tmp/build.log; fi
          python3 -c 'import glob,xml.etree.ElementTree as E; [(print("JVM",p,E.parse(p).getroot().attrib)) for p in glob.glob("nextvr-android/build/test-results/testDebugUnitTest/TEST-*.xml")]' >> /tmp/build.log
          # Strip ANSI colour codes, keep the last 60k characters (check-run limit).
          tail -c 60000 /tmp/build.log | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' > /tmp/build-tail.txt
          case "$OUTCOME" in
            success) CONCLUSION=success ;;
            *) CONCLUSION=failure ;;
          esac
          jq -n --rawfile t /tmp/build-tail.txt \
                --arg c "$CONCLUSION" \
                --arg sha "${{ github.sha }}" \
                '{name: "gradle-diagnostics", head_sha: $sha, status: "completed",
                  conclusion: $c,
                  output: {title: "Gradle build log (tail)", summary: "Build output for this commit", text: $t}}' \
            > /tmp/payload.json
          # The push and the pull_request runs of the same commit post at the same moment, and the
          # second one used to die on the API's secondary rate limit — turning a fully green build
          # into a red job with nothing wrong in it. Retry instead of failing the job for that.
          uploaded=0
          for attempt in 1 2 3 4; do
            if gh api -X POST "repos/${{ github.repository }}/check-runs" --input /tmp/payload.json; then
              uploaded=1
              break
            fi
            echo "check-run upload failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          [ "$uploaded" = "1" ] || echo "diagnostics upload failed (ignored)"

      # Diagnostics are best-effort, but validation is not: the build/test steps use
      # continue-on-error so their logs can be published before the job fails.
      # A anotação abaixo é de propósito: o log do job mora num blob do Azure e não abre em todo
      # lugar, então os últimos erros de /tmp/build.log vão como ANOTAÇÕES da rodada — que aparecem
      # direto na aba do commit e na API. Sem isso, "Process completed with exit code 1." era tudo
      # que sobrava para descobrir o que falhou.
      - name: Fail if any validation failed
        if: steps.ui.outcome != 'success' || steps.build.outcome != 'success' || steps.verify.outcome != 'success' || steps.sign.outcome != 'success'
        run: |
          echo "::error::etapas: ui=${{ steps.ui.outcome }} build=${{ steps.build.outcome }} verify=${{ steps.verify.outcome }} sign=${{ steps.sign.outcome }}"
          if [ -f /tmp/build.log ]; then
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r//g' /tmp/build.log \
              | grep -nE '(^|\b)(FAIL|failing|not ok|ERROR|error:|Error:|Exception|error\[|e: |não |falhou|exit code)' \
              | tail -25 | cut -c1-900 \
              | while IFS= read -r L; do echo "::error::${L}"; done
          else
            echo "::error::sem /tmp/build.log"
          fi
          exit 1

      - name: Publish debug APK to apk-dist branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Caminho absoluto de proposito: o passo faz `cd /tmp/apk-dist` antes do cp.
          APK=$(find "$GITHUB_WORKSPACE/nextvr-android/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK"
          rm -rf /tmp/apk-dist && mkdir -p /tmp/apk-dist/dist && cd /tmp/apk-dist
          git init -q -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$APK" dist/NextVR.apk
          # O APK se identifica: o arquivo ao lado dele diz de que run e de que commit ele veio, com
          # tamanho e md5, para conferir o download sem depender de um número escrito na mão em lugar
          # nenhum (a documentação aponta para este arquivo).
          SIZE=$(stat -c %s "$APK")
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          printf 'Debug APK built by Android CI run %s from commit %s\nsize: %s bytes\nmd5: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SIZE" "$MD5" > dist/build.txt
          cat dist/build.txt
          git add dist
          git commit -qm "Debug APK from CI run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            if git push --force origin apk-dist; then
              break
            fi
            echo "apk-dist push failed (attempt $attempt); retrying"
            sleep $((attempt * 4))
          done
          echo "APK published: branch apk-dist, path dist/NextVR.apk"


      - name: Upload native test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: nextvr-android/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nextvr-debug-apk
          # O build nao configura ABI splits, entao sai um unico
          # nextvr-android-debug.apk. O padrao anterior (*-universal-debug.apk)
          # nao casava com nada e o upload era pulado.
          path: nextvr-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

