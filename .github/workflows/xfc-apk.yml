name: XFC APK

# Gera o APK do XFC (jogo de futebol da XF Esports) e publica o APK + o zip do
# jogo para download direto. O build do XFC é isolado: `./gradlew -p xfc-game/android`
# não toca no app de VR do NextVR.

on:
  push:
    branches: [ "main", "arena/c478325b-nextvr-android", "arena/1d5a221b-nextvr-android", "arena/5d087ee3-nextvr-android", "arena/79ef9c3b-nextvr-android" ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar também na branch xfc-dist'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Publicar a release do XFC (sem atualizar xfc-dist)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build XFC APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install the test dependencies
        run: npm ci

      - name: Run the XFC tests
        id: xfc-tests
        continue-on-error: true
        run: |
          # O shell Bash do Actions usa -e por padrão; desative-o para capturar a saída do pipeline.
          set +e
          node --test --test-concurrency=2 tests/xfc-{game,animation,footballer-regression,football-actions,net-physics,reference-menus,pause-gestures-plan,ultimate,expanded,visual-upgrade,motion-continuity,assets-performance,reference-motion,career-penalty,season,reception-offside}.test.mjs 2>&1 | tee /tmp/xfc-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit=${TEST_EXIT}" >> "$GITHUB_OUTPUT"

      # O relatório dos testes vai para um check-run próprio: assim o resultado do
      # XFC fica legível na aba de checks do PR, mesmo quando a suíte do app de VR
      # (que roda no workflow da Android CI) está instável.
      - name: Publish the XFC test report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CONCLUSION=success
          if [ "${{ steps.xfc-tests.outputs.exit }}" != "0" ]; then
            CONCLUSION=failure
          fi
          {
            echo '### XFC — resultado dos testes'
            echo ''
            echo '```'
            # Inclua a falha, mesmo quando ela ocorre antes dos últimos testes.
            grep -B 2 -A 48 '^not ok' /tmp/xfc-tests.log || true
            tail -n 120 /tmp/xfc-tests.log || true
            echo '```'
          } > /tmp/xfc-summary.md
          jq -n \
            --arg title "XFC — testes do jogo" \
            --arg summary "$(cat /tmp/xfc-summary.md)" \
            --arg head_sha "$GITHUB_SHA" \
            --arg conclusion "$CONCLUSION" \
            '{name: $title, head_sha: $head_sha, status: "completed", conclusion: $conclusion,
              output: {title: $title, summary: $summary}}' > /tmp/xfc-check.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/xfc-check.json \
            --jq '"check-run: \(.html_url) (\(.conclusion))"'

      - name: Fail when the XFC tests fail
        if: steps.xfc-tests.outputs.exit == '' || steps.xfc-tests.outputs.exit != '0'
        run: exit 1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build XFC APK
        run: ./gradlew -p xfc-game/android assembleRelease --no-daemon --stacktrace

      - name: Check the game is inside the APK
        run: |
          set -e
          APK=$(find xfc-game/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK: $APK ($(stat -c %s "$APK") bytes)"
          unzip -Z1 "$APK" | grep -E '^assets/game/(index.html|styles/base.css|src/main.js|vendor/three\.module\.min\.js|assets/crests/.*\.png)$' | sort
          # O vendor/ é obrigatório: sem o three.js o grafo de módulos do jogo
          # não carrega e o app abre só com o fundo azul.
          unzip -Z1 "$APK" | grep -q '^assets/game/vendor/three\.module\.min\.js$'

      - name: Build the offline bundle (file:// support)
        # Gera o app.bundle.js que o index.html injeta quando os módulos ES
        # não sobem (ex.: duplo clique no index.html descompactado).
        run: node xfc-game/tools/build-bundle.mjs

      - name: Package the game as a zip
        run: |
          set -e
          cd xfc-game
          zip -r ../xfc-game.zip index.html styles src assets vendor serve.mjs README.md app.bundle.js -x '*.DS_Store'
          cd ..
          ls -l xfc-game.zip

      - name: Check the zip is a complete, unpacked-ready game
        run: |
          set -e
          for required in index.html src/main.js styles/base.css \
                          vendor/three.module.min.js app.bundle.js \
                          assets/brand/xfc-icon.svg; do
            if ! unzip -Z1 xfc-game.zip | grep -Fxq "$required"; then
              echo "::error::faltando no xfc-game.zip: $required"
              exit 1
            fi
          done
          echo "zip completo: index.html, src, styles, assets, vendor e app.bundle.js"

      - name: Publish to the xfc-dist branch
        if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'arena/c478325b-nextvr-android')) || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find "$GITHUB_WORKSPACE/xfc-game/android/app/build/outputs/apk" -name '*.apk' -print -quit)
          test -n "$APK"
          rm -rf /tmp/xfc-dist && mkdir -p /tmp/xfc-dist/dist && cd /tmp/xfc-dist
          git init -q -b xfc-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$APK" dist/xfc.apk
          cp "$GITHUB_WORKSPACE/xfc-game.zip" dist/xfc-game.zip
          SIZE=$(stat -c %s "$APK")
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          printf 'XFC APK built by run %s from commit %s\nsize: %s bytes\nmd5: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SIZE" "$MD5" > dist/build.txt
          cat dist/build.txt
          git add dist
          git commit -qm "XFC APK from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            if git push --force origin xfc-dist; then
              break
            fi
            echo "xfc-dist push failed (attempt $attempt); retrying"
            sleep $((attempt * 4))
          done
          echo "published: branch xfc-dist, paths dist/xfc.apk and dist/xfc-game.zip"

      - name: Publish the release with the direct download links
        if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'arena/c478325b-nextvr-android')) || inputs.publish_release || (github.event_name == 'push' && (github.ref_name == 'arena/5d087ee3-nextvr-android' || github.ref_name == 'arena/79ef9c3b-nextvr-android') && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Builds concorrentes podem terminar fora de ordem: o antigo não
          # deve sobrescrever os anexos da correção mais recente da mesma versão.
          REMOTE_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "Publicação ignorada: há um commit mais recente nesta branch."
            exit 0
          fi
          APK=$(find "$GITHUB_WORKSPACE/xfc-game/android/app/build/outputs/apk" -name '*.apk' -print -quit)
          TAG=xfc-gameplay-v0.5.36
          NOTES=$(printf '%s\n' \
            "XFC 27 v0.5.36 (versionCode 42), commit ${GITHUB_SHA}." \
            "" \
            "Correção dos menus de carreira: a arte inteira ocupa toda a largura, sem blur, bordas estendidas ou fundo duplicado. Hotspots e dados acompanham o quadro expandido; textos e escudos DOM mantêm proporções." \
            "Fluxos aprovados e gameplay da v0.5.35 preservados. Nenhuma alteração de física, IA, cabelo, modelo ou save nesta versão. Sem teste em telefone físico. Detalhes: docs/v0.5.36.md.")
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "XFC 27 — menu de carreira de ponta a ponta v0.5.36" \
              --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          else
            gh release edit "$TAG" --title "XFC 27 — menu de carreira de ponta a ponta v0.5.36" \
              --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
            # --target não move uma tag existente; manter fonte e APK alinhados.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi
          # O `gh release upload` funciona; o nome do arquivo do Gradle é
          # app-release.apk, então o anexo é renomeado para xfc.apk logo depois
          # (o link direto do arquivo não muda quando o nome muda).
          drop_asset() {
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$1\") | .id"); do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" > /dev/null
              echo "removido o anexo antigo: $1"
            done
          }
          drop_asset "xfc.apk"
          drop_asset "app-release.apk"
          gh release upload "$TAG" "$APK" --clobber
          gh release upload "$TAG" "$GITHUB_WORKSPACE/xfc-game.zip#xfc-game.zip" --clobber
          apk_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "app-release.apk") | .id' | head -n 1)
          if [ -n "$apk_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$apk_id" \
              -f name=xfc.apk -f label="XFC — aplicativo Android" --jq .name
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'

      - name: Upload the APK and the zip as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xfc-apk
          path: |
            xfc-game/android/app/build/outputs/apk/release/*.apk
            xfc-game.zip
          if-no-files-found: error
          retention-days: 30
