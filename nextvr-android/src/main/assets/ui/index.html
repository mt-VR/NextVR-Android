<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Next VR</title>

<link rel="stylesheet" href="./fonts.css">
<style>
  :root{
    --ink:#f2f4f8; --soft:#aab3c2; --faint:#6f7a8c;
    --glass:rgba(24,22,34,.82); --glass-2:rgba(34,31,46,.92);
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.19);
    --accent:#a78bfa; --accent-2:#7c6bff; --good:#8de6c8; --bad:#ff6b6b;
    --r-win:22px; --r-card:16px; --r-ctl:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070c;overscroll-behavior:none}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .ui-icon{display:block;width:1.35em;height:1.35em;pointer-events:none}
  .icon-label{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  [hidden]{display:none!important}

  /* ---------- camadas (ordem importa) ---------- */
  #gl{position:fixed;inset:0;z-index:1}                 /* ambiente 3D */
  #css3d{position:fixed;inset:0;z-index:2}              /* janelas = DOM real em 3D */
  #css3d>div{pointer-events:none}                       /* só o conteúdo recebe toque */
  #overlay{position:fixed;inset:0;z-index:3;pointer-events:none} /* MÃOS POR CIMA DE TUDO */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none}
  #hud>*{pointer-events:auto}

  /* ---------- janela 3D ---------- */
  /* shell sem overflow: a alça branca fica FORA da janela, embaixo, como no print */
  .win-shell{position:relative;pointer-events:auto}
  .win-handle{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);
    width:210px;height:10px;border-radius:99px;background:rgba(255,255,255,.9);
    box-shadow:0 2px 14px rgba(0,0,0,.5);cursor:grab;pointer-events:auto;transition:width .16s,background .16s}
  .win-shell.free .win-handle{width:150px;background:rgba(255,255,255,.65)}
  .win-shell.moving .win-handle{width:260px;background:#fff}
  .win-resize{position:absolute;right:9px;bottom:9px;width:78px;height:78px;border-radius:18px 0 18px 0;
    display:grid;place-items:center;color:rgba(255,255,255,.76);z-index:4;pointer-events:auto;cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 30%,rgba(167,139,250,.18));
    border-right:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.55);
    transition:background .16s,color .16s,transform .16s}
  .win-resize .ui-icon{width:30px;height:30px;transform:rotate(-45deg)}
  .win-shell.resizing .win-resize{color:#fff;background:rgba(124,107,255,.42);transform:scale(1.08)}
  .win-shell.resizing .win{border-color:rgba(167,139,250,.8);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 3px rgba(167,139,250,.28)}
  .win{width:1280px;height:820px;background:var(--glass);border:1px solid var(--line);
    border-radius:var(--r-win);overflow:hidden;display:flex;flex-direction:column;
    backdrop-filter:blur(18px);box-shadow:0 40px 120px rgba(0,0,0,.55);pointer-events:auto;
    transition:border-color .18s,box-shadow .18s}
  .win.focus{border-color:rgba(155,186,255,.55);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(155,186,255,.28)}
  .win-bar{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;
    background:var(--glass-2);border-bottom:1px solid var(--line)}
  .win-grip{width:38px;height:6px;border-radius:99px;background:rgba(255,255,255,.22);flex:none;cursor:grab}
  .win-title{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .win-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.07);font-size:19px}
  .win-btn.wide{width:auto;min-width:66px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:700}
  .win-btn.wide[aria-pressed="true"]{background:rgba(167,139,250,.42);color:#fff;box-shadow:0 0 0 1px rgba(167,139,250,.5)}
  .win-btn .ui-icon{width:22px;height:22px}
  .win-btn:active{background:rgba(255,255,255,.2)}
  .win-btn.close{background:rgba(255,80,80,.16);color:#ff8f8f}
  .win-btn.close:active{background:#e5484d;color:#fff}
  .win-body{flex:1;min-height:0;position:relative;background:#11151d}
  .win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}

  /* ---------- conteúdos ---------- */
  .pad{padding:26px 30px;overflow-y:auto;height:100%}
  .row{display:flex;align-items:center;gap:12px}
  .fld{flex:1;min-width:0;height:58px;border-radius:999px;background:rgba(255,255,255,.08);
    border:1px solid var(--line-2);padding:0 22px;color:var(--ink);font:500 21px Inter,sans-serif;outline:none}
  .fld::placeholder{color:var(--faint)}
  .go{height:58px;min-width:58px;padding:0 22px;border-radius:999px;background:var(--accent);color:#10182b;font-weight:700;font-size:19px;display:grid;place-items:center}
  .go .ui-icon{width:25px;height:25px}
  .go:active{background:#fff}

  h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.4px}
  .sub{margin:0 0 20px;color:var(--soft);font-size:17px;line-height:1.5}
  .sec{margin:26px 0 12px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .card{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;margin-bottom:12px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
  .opt:first-child{border-top:0}
  .opt-l{min-width:0}
  .opt-t{font-size:19px;font-weight:600}
  .opt-d{font-size:14px;color:var(--soft);margin-top:3px;line-height:1.45}
  .sw{width:70px;height:40px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .18s}
  .sw:after{content:'';position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;transition:transform .18s}
  .sw[data-on="1"]{background:var(--accent-2)}
  .sw[data-on="1"]:after{transform:translateX(30px)}
  input[type=range]{width:230px;accent-color:var(--accent)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:17px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#10182b;border-color:transparent}
  .seg-btn{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    font-size:17px;font-weight:600}
  .seg-btn:hover{background:rgba(167,139,250,.2);border-color:var(--accent)}
  .tabs{display:flex;gap:8px;padding:0 0 18px;overflow-x:auto}
  .tabs button{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.07);font-size:17px;font-weight:600;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:#eef1f7;color:#10182b}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .thumb{aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .env{aspect-ratio:16/10;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .env span{position:absolute;left:14px;bottom:12px;font-size:18px;font-weight:700;text-shadow:0 2px 8px #000}
  .env[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
  .env-pano span{background:rgba(8,10,16,.5);border-radius:8px;padding:4px 9px;left:10px;bottom:10px}
  .note{margin-top:18px;font-size:14px;color:var(--faint);line-height:1.6}
  .warn{background:rgba(255,190,80,.1);border:1px solid rgba(255,190,80,.3);color:#ffd79a;
    border-radius:var(--r-card);padding:16px 18px;font-size:16px;line-height:1.55;margin-bottom:16px}
  .big{display:grid;place-items:center;height:100%;text-align:center;padding:40px;gap:18px}

  /* primeira execução: a escolha de idioma fica dentro de uma única janela 3D */
  /* Escolha de idioma com a identidade da referência: cartão claro, idioma atual destacado em cima,
     lista vertical abaixo, ilustração da mão com o controle à direita e o botão continuar.
     Os doze idiomas têm de aparecer DE UMA VEZ, como no print, e a pinça não rola lista. Em vez de
     acertar a altura da linha na mão (que depende da métrica da fonte e da plataforma), as linhas
     DIVIDEM o espaço disponível: `flex:1 1 0` com `min-height:0` dá exatamente um doze avos da lista
     para cada idioma, seja qual for a altura da janela — que, aliás, está presa em 660 px, porque o
     slot de textura de uma janela no atlas nativo tem 980 px de altura com 160 px de margem por
     lado. `line-height` é explícito em cada peça para o texto não crescer dentro da linha. */
  .langwin{height:100%;width:100%;padding:28px 38px 20px;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#fcfcff,#e8e8f1);color:#15171e}
  .lq-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .lq-pick{background:#e4e4ec;border-radius:12px;padding:8px 14px;font-size:20px;line-height:1.25;font-weight:600;color:#1b1d24}
  .lq-title{font-size:14px;line-height:1.25;letter-spacing:.16em;text-transform:uppercase;color:#7c8090}
  .lq-main{flex:1;display:flex;gap:24px;min-height:0}
  .lang-options{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;overflow-y:auto;padding-right:4px}
  .lang-option{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
    flex:1 1 0;min-height:0;padding:8px 14px;border-radius:10px;font-size:18px;line-height:1.25;
    font-weight:500;color:#22242c}
  .lang-option[aria-pressed="true"]{background:#e4e4ec;font-weight:650}
  .lang-option:hover:not(.soon),.lang-option:focus-visible{background:#eef0f8}
  .lang-option.soon{color:#a6a9b6;cursor:default}
  /* A nota das linhas sem tradução fica em UMA linha: duas linhas pediriam altura que a linha do
     idioma não tem mais (ela é uma fração fixa do espaço), e o texto vazaria da linha. */
  .lang-option.soon i{font-size:11px;font-style:normal;color:#b3b6c2;text-align:right;max-width:42%;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lq-art{width:36%;display:grid;place-items:center}
  .lq-art img{width:100%;max-width:330px;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(20,22,34,.2))}
  .lq-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:12px}
  .lq-go{background:#2f6bff;color:#fff;font-size:18px;line-height:1.25;font-weight:650;padding:11px 34px;border-radius:999px;
    box-shadow:0 10px 24px rgba(47,107,255,.3)}
  .lq-go:hover{filter:brightness(1.06)}
  .lq-go:active{transform:scale(.97)}
  .lang-tracking{font-size:14px;color:#82869a}
  /* Mesma tela aberta como janela normal (Configurações): aqui a barra de título ocupa 62 px dos
     660 px, então a lista encurta as linhas para os doze idiomas continuarem aparecendo de uma vez
     (12 x 34 px + 11 vãos de 2 px = 430 px dentro dos ~456 px que sobram). */
  .langwin.slim .lq-head{margin-bottom:10px}
  .langwin.slim .lq-pick{padding:6px 12px;font-size:18px}
  .langwin.slim .lang-option{padding:7px 14px;font-size:16px}
  .langwin.slim .lq-foot{margin-top:10px}
  .langwin.slim .lq-go{padding:9px 28px;font-size:17px}
  @media(max-width:700px){.langwin{padding:24px 20px}.lq-art{display:none}.lang-option{font-size:19px}}

  /* ---------- loja (igual ao print) ---------- */
  .st{background:#232327;height:100%;overflow-y:auto;padding:18px 24px 30px;color:#f2f2f5}
  .st-top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .st-logo-img{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 7px #0008)}
  .st-tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
  .st-tab{padding:11px 20px;border-radius:999px;font-size:16px;font-weight:600;color:#cfd3da;white-space:nowrap;flex:none}
  .st-tab[aria-selected="true"]{background:#f2f2f5;color:#17171a}
  .st-ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#baa7f7,#6962bc);
    display:grid;place-items:center;font-size:24px;flex:none}
  .st-ava .ui-icon,.st-x .ui-icon{width:23px;height:23px;margin:auto}
  .st-x{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);
    font-size:19px;font-weight:700;flex:none;display:grid;place-items:center}
  .st-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .st-btn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:13px;
    padding:15px 10px;font-size:14px;font-weight:800;letter-spacing:.03em}
  .st-btn:active{background:rgba(255,255,255,.24)}
  .st-note{margin:12px 2px;color:#9aa0ab;font-size:15px;line-height:1.65}

  /* ---------- biblioteca: grade Quest com navegação lateral e capas ---------- */
  .lib{height:100%;display:flex;overflow:hidden;background:linear-gradient(145deg,#262930,#1d2026);color:#f2f4f8}
  .lib-rail{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:17px 10px;background:rgba(9,12,17,.24);border-right:1px solid rgba(255,255,255,.07)}
  .lib-nav{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;
    color:#aeb5c2;transition:background .15s,color .15s,transform .15s}
  .lib-nav .ui-icon{width:23px;height:23px}
  .lib-nav:hover,.lib-nav[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
  .lib-nav[aria-pressed="true"]:before{content:'';position:absolute;left:-11px;width:3px;height:20px;border-radius:3px;background:#a98bff}
  .lib-nav:active{transform:scale(.94)}
  .lib-rail-spacer{flex:1}
  .lib-nav-store{color:#ffc16a;background:rgba(255,173,76,.1)}
  .lib-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .lib-head{display:flex;align-items:center;gap:10px;padding:16px 22px 12px}
  .lib-title{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
  .lib-sbtn{color:#cfd3da;width:44px;height:44px;flex:none;display:grid;place-items:center}
  .lib-sbtn .ui-icon{width:24px;height:24px}
  .lib-search{display:none;flex:0 1 200px;min-width:0;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 16px;color:#fff;
    font:500 15px Inter,sans-serif;outline:none}
  .lib-search.open{display:block}
  .lib-head-spacer{flex:1;min-width:6px}
  .lib-pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:999px;
    padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .lib-pill .ui-icon{width:16px;height:16px}
  .lib-pill:active{background:rgba(255,255,255,.22)}
  .lib-scroll{flex:1;min-height:0;overflow-y:auto;padding:3px 22px 18px}
  .lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px 14px}
  .lib-tile{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:0;
    border-radius:15px;text-align:left;color:#fff;transition:transform .14s,filter .14s}
  .lib-tile:active{filter:brightness(1.18);transform:scale(.985)}
  .lib-cover{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;min-height:82px;overflow:hidden;
    display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);border-radius:15px;
    background-color:#272b34;box-shadow:0 9px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12)}
  .lib-cover:before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 48%),radial-gradient(ellipse at 50% 110%,rgba(0,0,0,.23),transparent 70%)}
  .lib-brand{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:12px;text-align:center}
  .lib-brand img.logo{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 7px rgba(0,0,0,.2))}
  .lib-brand .nm{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .lib-brand .fb{display:none}
  .lib-tile.nologo .lib-brand .fb{display:inline}
  .lib-icon{width:54px;height:54px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 3px 8px rgba(0,0,0,.2))}
  .lib-icon .ui-icon{width:100%;height:100%;stroke-width:1.65}
  .lib-label{display:block;overflow:hidden;color:#e8ebf1;font-size:15px;font-weight:600;line-height:1.3;
    text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .lx-netflix{color:#ff2433;font-weight:900;font-size:27px;letter-spacing:.12em;text-shadow:0 2px 7px #0008}
  .lx-prime{font-size:20px;font-weight:700;line-height:1.05;text-align:center;text-shadow:0 2px 6px #0005}
  .lx-prime b{display:block}
  .lx-prime:after{content:'';display:block;width:56px;height:7px;border-bottom:3px solid #4aa8ff;
    border-radius:0 0 50% 50%;margin:2px auto 0}
  .lx-pluto{font-size:23px;font-weight:800;display:flex;align-items:center;gap:5px;text-shadow:0 2px 5px #0008}
  .lx-pluto i{font-style:normal;font-size:12px;color:#ffd23f;border:2px solid #ffd23f;border-radius:50%;
    width:27px;height:27px;display:inline-grid;place-items:center}
  .lib-vr{position:absolute;top:9px;right:9px;z-index:3;font-size:10px;font-weight:700;border:1.5px solid rgba(255,255,255,.7);
    background:rgba(20,20,24,.56);border-radius:5px;padding:3px 7px}
  .lib-empty{padding:40px 8px;text-align:center;color:rgba(255,255,255,.7);font-size:15px;grid-column:1/-1}
  @media(max-width:900px){.lib-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 12px}.lib-head{padding-left:15px;padding-right:15px}.lib-scroll{padding-left:15px;padding-right:15px}}

  /* ---------- teclado estilo Meta Quest: painel escuro, deitado, teclas graúdas ---------- */
  .kb{width:1150px;background:rgba(24,26,31,.93);border:1px solid rgba(255,255,255,.09);
    border-radius:28px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;
    backdrop-filter:blur(18px);pointer-events:auto;box-shadow:0 44px 130px rgba(0,0,0,.65)}
  .kb-row{display:flex;gap:10px;flex-wrap:nowrap}
  .key{flex:1 1 0;min-width:0;height:88px;border-radius:16px;background:#343941;color:#eef1f6;
    display:grid;place-items:center;font-size:29px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.32)}
  .key.wide{flex:1.65 1 0;background:#2a2e35}
  .key.wide .ui-icon{width:34px;height:34px}
  .key.space{flex:5.2 1 0;font-size:21px;font-weight:600;color:#9aa6b6;letter-spacing:.04em}
  .key.enter{flex:1.9 1 0;background:#e6eaf1;color:#171a1f}
  .key.util{background:#2a2e35;color:#c6cdd8;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
  .key .ui-icon{width:32px;height:32px}
  .key.hot{background:#fff;color:#14181d;transform:translateY(2px);box-shadow:none}
  .key[data-state="once"]{background:#4a5160;color:#fff}
  .key[data-state="lock"]{background:#7a8497;color:#fff}

  /* ---------- dock: barra cinza-azulado estilo Meta Horizon (sem separadores) ---------- */
  .dock{position:relative;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;
    align-items:center;gap:12px;width:max-content;padding:10px 14px 12px 12px;border-radius:24px;
    background:linear-gradient(180deg,rgba(56,66,82,.88),rgba(38,46,60,.94));
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
    box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.30);
    pointer-events:auto}
  .dock button{color:#e9edf4}
  /* Quest-style grabber: the hit area floats below the dock; only a short white pill is drawn.
     Atlas padding keeps this detached control visible without adding a second dock panel. */
  .dock-grab{position:absolute;left:50%;top:calc(100% + 12px);bottom:auto;transform:translateX(-50%);z-index:5;
    width:140px;height:16px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 4px;
    border:0;border-radius:0;background:transparent;color:#fff;cursor:grab;touch-action:none;pointer-events:auto}
  .dock-grab::after{content:"";display:block;width:56px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.88);box-shadow:0 1px 7px rgba(255,255,255,.28),0 2px 7px rgba(0,0,0,.38);
    transition:width .16s,height .16s,background .16s,box-shadow .16s}
  .dock.grab-armed .dock-grab::after,.dock.moving .dock-grab::after{width:68px;height:5px;background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.4)}
  .dock.moving .dock-grab{cursor:grabbing}

  /* perfil + status (hora, wifi, bateria) */
  .dock-av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,#c9b6fb,#6a63bf);border:2px solid rgba(255,255,255,.26);
    box-shadow:0 2px 8px rgba(0,0,0,.4);transition:filter .15s,transform .15s}
  .dock-av svg{width:20px;height:20px}
  .dock-status{display:flex;align-items:center;gap:8px;flex:none;height:38px;padding:0 12px;border-radius:12px;
    background:rgba(255,255,255,.09);font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;
    font-variant-numeric:tabular-nums;transition:background .15s}
  .dk-time{font-size:15px}
  .dk-wifi svg,.dk-bat svg{display:block;width:19px;height:19px;color:#c7d0de}
  .dock-tool{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.09);color:#cdd5e3;transition:background .15s,transform .15s}
  .dock-tool svg{width:20px;height:20px}
  .dock-status:hover,.dock-tool:hover{background:rgba(120,160,220,.22)}
  .dock-av:hover{filter:brightness(1.12)}
  .dock-av:active,.dock-tool:active,.dock-status:active{transform:scale(.92)}
  .dock-sep{width:1.5px;height:24px;border-radius:2px;background:rgba(255,255,255,.16);flex:none;margin:0 2px}
  .dock-spacer{width:14px;flex:none}

  /* apps — ícones quadrados com bordas arredondadas (squircle estilo Quest) */
  .dock-app{position:relative;width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
    color:#fff;border:1px solid rgba(255,255,255,.2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.4);
    transition:transform .16s,filter .16s}
  .dock-app svg{width:23px;height:23px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .dock-app img{width:24px;height:24px;object-fit:contain}
  .dock-app:hover,.dock-app.dock-hover{transform:translateY(-3px) scale(1.08);filter:brightness(1.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 2px rgba(39,232,255,.5),0 8px 18px rgba(0,0,0,.45)}
  .dock-tool:hover,.dock-tool.dock-hover,.dock-av:hover,.dock-av.dock-hover,.dock-status:hover,.dock-status.dock-hover{background:rgba(120,160,220,.28);transform:translateY(-2px) scale(1.06)}
  .dock-app:active{transform:scale(.9)}
  .dock button.near-press{transform:scale(.88)!important;filter:brightness(1.3)!important}
  .dock-tool.near-press,.dock-av.near-press,.dock-status.near-press{transform:scale(.92)!important}
  .dock-app.near-press{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 3px rgba(39,232,255,.8),0 2px 8px rgba(0,0,0,.3)!important}
  .dock-dot{position:absolute;left:50%;bottom:-7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;
    background:#fff;opacity:0;transform:scale(.4);transition:opacity .16s,transform .16s;pointer-events:none}
  .dock-dot.on{opacity:.95;transform:scale(1)}

  /* lançador de 9 pontos (último item) — também quadrado arredondado */
  .dock-launcher{background:rgba(255,255,255,.12)!important;box-shadow:none;border-color:rgba(255,255,255,.1)}
  .dk-grid{display:grid;grid-template-columns:repeat(3,5px);gap:3px}
  .dk-grid i{display:block;width:5px;height:5px;border-radius:1.5px;background:#eef1f7}

  /* ============ mundo 3D jogável (plataforma de jogos nativa) ============ */
  .game-tools{height:100%;padding:20px 22px;display:flex;flex-direction:column;gap:13px;overflow:auto}
  .gt-sec{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .gt-row{display:flex;gap:10px;flex-wrap:wrap}
  .gt-btn{min-height:58px;padding:0 20px;border-radius:16px;background:rgba(255,255,255,.08);
    border:1px solid var(--line);font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
  .gt-btn[aria-pressed="true"]{background:var(--accent);color:#10182b;border-color:transparent}
  .gt-btn.danger{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.4);color:#ffb3b3}
  .gt-btn.primary{flex:1;justify-content:center;background:var(--accent-2);color:#fff;border-color:transparent}
  .gt-colors{gap:12px}
  .gt-color{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
  .gt-color[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}
  .gt-status{font-size:17px;color:var(--soft);line-height:1.5}
  /* Menu do jogo: painel PLANO na frente do usuário (estilo SteamVR), nunca curvo. */
  .game-menu{height:100%;padding:26px;display:flex;flex-direction:column;gap:14px}
  .gm-t{font-size:24px;font-weight:700;margin-bottom:4px}
  .gm-btn{min-height:88px;border-radius:20px;background:rgba(255,255,255,.09);border:1px solid var(--line-2);
    font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
  .gm-btn.danger{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.45);color:#ffc9c9}
  .gm-btn .ui-icon{width:28px;height:28px}
  /* Anel de espera do acorde de duas mãos, preso na cabeça junto com o HUD. */
  #gameRing{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;
    border-radius:50%;display:grid;place-items:center}
  #gameRing span{width:70px;height:70px;border-radius:50%;background:rgba(10,12,18,.72);
    border:1px solid rgba(255,255,255,.2)}
  /* Jogo em andamento: some o chrome (status/permissões), ficam o mundo, o painel e o anel. */
  .game-on #hud>*:not(#gameRing){display:none}
  /* ---------- HUD ---------- */
  #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#05070c;padding:28px}
  .boot-c{width:min(560px,100%);text-align:center}
  .logo{margin-bottom:12px;display:grid;place-items:center}
  .logo img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 18px #0009)}
  .start{margin-top:26px;width:100%;padding:22px;border-radius:18px;background:var(--accent);color:#10182b;font-size:20px;font-weight:800}
  .hint{margin-top:18px;font-size:14px;color:var(--faint);line-height:1.7}
  #perm{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:6;display:flex;gap:10px}
  #perm button{padding:14px 22px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line-2);
    font-size:15px;font-weight:600;backdrop-filter:blur(10px)}
  #toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    z-index:7;max-width:86vw;background:rgba(10,12,18,.94);border:1px solid var(--line-2);
    padding:13px 22px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;text-align:center;pointer-events:none!important}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #stat{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;z-index:6;display:flex;gap:8px;align-items:center;
    font-size:12px;font-weight:600;color:var(--soft);background:rgba(10,12,18,.6);padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);backdrop-filter:blur(8px)}
  #stat i{width:7px;height:7px;border-radius:50%;background:var(--faint);font-style:normal}
  #stat i.on{background:var(--good)}
  #fps{color:var(--faint)}

  html.native,html.native body{background:transparent;width:4096px;height:4096px}
  .native #gl{display:none}
  .native #css3d,.native #atlas{position:absolute;inset:0;width:4096px;height:4096px}
  .native #head-overlay{position:absolute;left:0;top:0;width:1200px;height:800px;overflow:hidden;z-index:5;pointer-events:none}
  .native #head-overlay #hud,.native #head-overlay #overlay,.native #head-overlay #boot{position:absolute}
  .native #head-overlay #overlay{width:1200px;height:800px}
  .native #head-overlay #toast,.native #head-overlay #stat,.native #head-overlay #perm{position:absolute}
  .native [data-native-browser]{touch-action:none}
  .phone-grab-hover .win{outline:2px solid rgba(255,255,255,.9)}
  /* ---------- janelas de apps do Android: barra branca da referência + conteúdo real ---------- */
  .app-window{display:flex;flex-direction:column;height:100%;min-height:0;background:#0d1015}
  .app-bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;
    background:#fff;color:#101319;border-bottom:1px solid rgba(0,0,0,.10)}
  .app-badge{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
    background:rgba(16,19,25,.08);border-radius:999px;padding:5px 11px}
  .app-badge.mirror{background:#ffd9c2}
  .app-bar-spacer{flex:1;min-width:4px}
  .app-key{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(16,19,25,.07);
    display:grid;place-items:center;color:#20242c;transition:background .14s,transform .14s}
  .app-key .ui-icon{width:20px;height:20px}
  .app-key:active{background:rgba(16,19,25,.2);transform:scale(.93)}
  .app-surface{position:relative;flex:1;min-height:0;background:#07090d;overflow:hidden}
  .app-state{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;text-align:center;
    padding:26px;color:#e8ebf1;font-size:16px;font-weight:600;line-height:1.45;
    background:rgba(7,9,13,.86);z-index:2}
  .app-state[hidden]{display:none}
  .app-state[data-state="failed"]{color:#ffb4b4}
  /* The way out of a window that could not be filled: open the app on the phone. */
  .app-state-btn{margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:9px 16px;color:#fff;font-size:13.5px;font-weight:700}
  .app-state-btn:active{background:rgba(255,255,255,.26)}
  .win.app-failed .app-bar{background:#ffe7e7}

  /* contagem de janelas de apps abertas, na dock */
  .dock-badge{position:absolute;top:-5px;right:-5px;z-index:4;min-width:17px;height:17px;padding:0 4px;
    border-radius:999px;background:#57dfa1;color:#052c1a;font-size:10.5px;font-weight:800;
    display:grid;place-items:center;box-shadow:0 2px 7px rgba(0,0,0,.5)}

  /* ---------- apps instalados no aparelho, dentro do MENU de aplicações que já existe ----------
     O tile é o mesmo .lib-tile da referência; o que muda é o conteúdo da capa: o ícone real que o
     PackageManager devolveu (servido pelo lado nativo em /apps/<arquivo>.png) sobre um fundo neutro.
     Sem ícone ainda — ou sem ícone legível — a capa mostra as iniciais do app, como os apps da web. */
  .lib-tile.android .lib-cover{background:rgba(255,255,255,.07)}
  /* 52 px: the same box the web apps' logos use in this grid (see .lib-brand img.logo), so an
     installed app and a NextVR app are drawn at the same size next to each other. */
  .lib-app-icon{position:relative;z-index:1;width:52px;height:52px;object-fit:contain;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
  /* O nome nunca aparece sobre o ícone; as iniciais são o que fica no lugar quando ele não veio. */
  .lib-tile.android .lib-brand .nm{display:none}
  .lib-tile.android .lib-cover.noicon .nm{display:inline;position:relative;z-index:1;
    color:rgba(255,255,255,.72);font-size:25px;font-weight:800;letter-spacing:.05em}
  .lib-tile.android[data-session="running"] .lib-cover{border-color:rgba(87,223,161,.7);
    box-shadow:0 9px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px rgba(87,223,161,.26)}
  .lib-src{position:absolute;left:8px;bottom:8px;z-index:3;width:22px;height:22px;border-radius:7px;
    display:grid;place-items:center;color:#dfe6f2;background:rgba(12,14,20,.62);border:1px solid rgba(255,255,255,.2)}
  .lib-src .ui-icon{width:13px;height:13px}
  /* A system app is marked, the same way the grid marks a VR game: it is not something the user
     installed, and hiding that would make the menu look like it invented tiles. */
  .lib-sys{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;font-weight:700;border-radius:6px;
    padding:3px 7px;background:rgba(20,20,24,.62);border:1px solid rgba(255,255,255,.24);color:#c9d2df}
  .lib-open{position:absolute;top:8px;right:8px;z-index:3;font-size:10px;font-weight:700;border-radius:6px;
    padding:3px 7px;background:rgba(87,223,161,.92);color:#052c1a}
  .lib-tile.android[data-session="suspended"] .lib-open{background:rgba(255,255,255,.84);color:#15181e}

  /* ---------- a única linha específica de Android na interface ----------
     Existe só enquanto o serviço shell não está pronto, para dizer qual dos dois mecanismos o tile
     vai usar e como chegar no outro. Com o serviço pronto ela não é criada. */
  .lib-note,.az-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:15px}
  .az-dot{width:11px;height:11px;flex:none;border-radius:50%;background:#8b93a1;box-shadow:0 0 0 4px rgba(139,147,161,.16)}
  .az-dot[data-state="ready"]{background:#57dfa1;box-shadow:0 0 0 4px rgba(87,223,161,.2)}
  .az-dot[data-state="ask"]{background:#ffc857;box-shadow:0 0 0 4px rgba(255,200,87,.18)}
  .az-dot[data-state="install"],.az-dot[data-state="start"],.az-dot[data-state="update"],
  .az-dot[data-state="denied"]{background:#ff7b7b;box-shadow:0 0 0 4px rgba(255,123,123,.18)}
  /* PhoneXR runtime: the same dot language, plus the runtime's own states. */
  .az-dot[data-state="ready"]{background:#57dfa1}
  .az-dot[data-state="outdated"]{background:#ffc857;box-shadow:0 0 0 4px rgba(255,200,87,.18)}
  .az-dot[data-state="missing"]{background:#ff7b7b;box-shadow:0 0 0 4px rgba(255,123,123,.18)}
  .az-text{flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;font-weight:600;color:#e8ebf1}
  .az-text small{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);white-space:pre-wrap}
  .az-btn{flex:none;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.17);border-radius:999px;
    padding:9px 15px;font-size:13px;font-weight:700;color:#fff}
  .az-btn.ghost{background:transparent}
  .az-btn:active{background:rgba(255,255,255,.26)}
  .az-caps{flex-basis:100%;margin:10px 0 0;padding:12px;border-radius:12px;background:#0b0e13;color:#c9d2df;
    font-size:11.5px;line-height:1.45;max-height:230px;overflow:auto;white-space:pre-wrap}


</style>
</head>
<body>

<div id="gl"></div>
<div id="css3d"></div>
<canvas id="overlay"></canvas>

<div id="hud">
  <div id="stat"><i id="dotHand"></i><span id="lblHand">mãos</span><i id="dotGyro"></i><span id="lblGyro">giro</span><span id="fps"></span></div>
  <div id="perm" hidden>
    <button id="btnGyro">Ativar giroscópio</button>
    <button id="btnHand">Ativar mãos</button>
  </div>
</div>

<div id="toast"></div>

<!-- primeira execução: idioma -->
<div id="boot">
  <div class="boot-c">
    <div class="logo"><img src="./icons/nextvr-n.png" alt="NextVR"></div>
    <div id="bootSub" style="color:var(--soft);font-size:16px">Next VR</div>
    <button id="bootGo" class="start">Entrar</button>
    <p class="hint" id="bootHint">
      Aponte o celular para a frente ao entrar. Use o controle Centralizar na dock a qualquer momento.
    </p>
  </div>
</div>


<!-- The typing engine, before the bundle: windows.js writes through window.__nextvrTyping. The
     native side injects this same file into hosted pages, so both edit text the same way. -->
<script defer src="./typing.js"></script>
<script defer src="./app.js"></script>
</body>
</html>
