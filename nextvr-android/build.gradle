apply plugin: 'com.android.application'

// NextVR: Google Cardboard app built on the official Cardboard SDK for Android NDK.
// The SDK is vendored in this repository under sdk/ (see README.md).
android {
    compileSdk = 35
    lintOptions {
        abortOnError = false
    }
    defaultConfig {
        applicationId "com.nextvr.app"
        // #gles3 #vulkan - You can reduce minSdkVersion down to 16 depending
        // on rendering APIs supported:
        //
        // OpenGL ES 2.0 - Requires 16 or higher
        // OpenGL ES 3.0 - Requires 18 or higher
        // Vulkan        - Requires 24 or higher
        //
        // See the release notes for details.
        minSdkVersion = 26
        targetSdkVersion = 35
        // Must match the NDK used by the vendored Cardboard SDK module.
        ndkVersion = "29.0.14206865"
        // 29 / 2.0.0: Nova interface flutuante Library (7e3d8ab40bd4dd3) 100% transparente sobre a câmera traseira real e selo verificado vermelho igual do TikTok para cada colaborador.
        versionCode 51
        versionName "2.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The Cardboard SDK .so files are shipped for these ABIs. Remove the
        // abiFilters line to build for every ABI (x86/x86_64 included), which is
        // what you need to run on the Android Studio emulator.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments "-DANDROID_STL=c++_shared"
        }
    }
    // Assinatura de depuração FIXA, no repositório. O Android recusa instalar um APK por cima de
    // outro com assinatura diferente ("App not installed" / INSTALL_FAILED_UPDATE_INCOMPATIBLE), e a
    // chave de depuração padrão nasce no HOME de quem compila: sem isto, cada runner do CI (e cada
    // máquina) produz uma chave nova e nenhuma rodada instala por cima da anterior. Este é o keystore
    // de depuração padrão do Android — alias androiddebugkey, senha android, CN=Android Debug — que
    // é público por definição; não é segredo e não serve para publicar, só para depurar.
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild.cmake {
        path "CMakeLists.txt"
    }
    androidResources { noCompress += ['task', 'bin'] }
    namespace = 'com.nextvr.app'

    // The privileged half of the Android app windows is an AIDL interface implemented by a Shizuku
    // user service (see src/main/aidl/com/nextvr/app/apps/IDisplayService.aidl and
    // docs/ANDROID-APP-WINDOWS.md). Without `aidl true` the stub is never generated and the whole
    // feature fails to compile — this is the one build switch the feature needs.
    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
    // TFLite runtime MediaPipe's HandLandmarker executes on (libtensorflowlite_jni.so). It is NOT the
    // YOLO interpreter: it must stay even though the YOLO pose model was removed.
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Android Mobile Vision - used by the Cardboard SDK to read viewer QR codes.
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.19.4'
    implementation project(":sdk")
    // Shizuku: the shell user service (privileged display/launch/inject) and its binder provider.
    // No root is involved: Shizuku is started once by the user over ADB or wireless debugging and
    // runs the helper with the shell identity (uid 2000), which is what holds CAPTURE_VIDEO_OUTPUT,
    // ADD_TRUSTED_DISPLAY and INJECT_EVENTS.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// The dependencies for NDK builds live inside the .aar files so they need to
// be extracted before NDK targets can link against.
task extractNdk {
    dependsOn ':sdk:assembleRelease'
    doLast {
        copy {
            from zipTree("${project.rootDir}/sdk/build/outputs/aar/sdk-release.aar")
            into "libraries/"
            include "jni/**/libGfxPluginCardboard.so"
        }
        copy {
            from "${project.rootDir}/sdk/include/cardboard.h"
            into "libraries/"
        }
    }
}

task deleteNdk(type: Delete) {
    delete "libraries/jni"
    delete "libraries/cardboard.h"
}

// The PhoneXR runtime is a published artifact of the upstream PhoneXR project — the monado-based
// OpenXR runtime that hosts headset games (docs/PHONEXR-INTEGRATION.md). One pinned commit: the
// asset ships inside this APK, and the runtime install/self-test verify exactly that build. It is
// too big for git, so, like libraries/, it is materialized in the build: shipped as-is when it is
// the pinned bytes, otherwise refetched — never silently shipping something else.
def phonexrRuntimeAsset = new File(projectDir, "src/main/assets/xr/runtime/phonexr-runtime.apk")
def phonexrRuntimeOrigin = "https://github.com/samrat1games/phonexr/raw/" +
    "27c5bc469fb736fb0c00b7254a6dfc532fea7003/app/src/main/assets/runtime/phonexr-runtime.apk"
def phonexrRuntimeSha256 = "56dd0f53317e1e70d240d4de39217f7553011a04b1d4cf22a637de6d1ebf7fa8"

task fetchPhoneXrRuntime {
    outputs.file(phonexrRuntimeAsset)
    doLast {
        def sha256 = { file ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            file.withInputStream { stream ->
                def buffer = new byte[64 * 1024]
                for (def read = stream.read(buffer); read > 0; read = stream.read(buffer))
                    digest.update(buffer, 0, read)
            }
            digest.digest().encodeHex().toString()
        }
        if (phonexrRuntimeAsset.file && sha256(phonexrRuntimeAsset) == phonexrRuntimeSha256) return
        phonexrRuntimeAsset.parentFile.mkdirs()
        new URL(phonexrRuntimeOrigin).withInputStream { stream ->
            phonexrRuntimeAsset.withOutputStream { it << stream }
        }
        if (sha256(phonexrRuntimeAsset) != phonexrRuntimeSha256)
            throw new GradleException(
                "PhoneXR runtime download does not match the pinned build " + phonexrRuntimeSha256 +
                " — hand-verify the upstream APK at " + phonexrRuntimeOrigin + " first")
    }
}

preBuild.dependsOn(extractNdk, fetchPhoneXrRuntime)
clean.dependsOn(deleteNdk)
