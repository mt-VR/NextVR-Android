apply plugin: 'com.android.application'

// NextVR: Google Cardboard app built on the official Cardboard SDK for Android NDK.
// The SDK is vendored in this repository under sdk/ (see README.md).
android {
    compileSdk = 35
    lintOptions {
        abortOnError = false
    }
    defaultConfig {
        applicationId "com.nextvr.cardboard"
        // #gles3 #vulkan - You can reduce minSdkVersion down to 16 depending
        // on rendering APIs supported:
        //
        // OpenGL ES 2.0 - Requires 16 or higher
        // OpenGL ES 3.0 - Requires 18 or higher
        // Vulkan        - Requires 24 or higher
        //
        // See the release notes for details.
        minSdkVersion = 26
        targetSdkVersion = 35
        // Must match the NDK used by the vendored Cardboard SDK module.
        ndkVersion = "29.0.14206865"
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The Cardboard SDK .so files are shipped for these ABIs. Remove the
        // abiFilters line to build for every ABI (x86/x86_64 included), which is
        // what you need to run on the Android Studio emulator.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments "-DANDROID_STL=c++_shared"
        }
    }
    // Assinatura de depuração FIXA, no repositório. O Android recusa instalar um APK por cima de
    // outro com assinatura diferente ("App not installed" / INSTALL_FAILED_UPDATE_INCOMPATIBLE), e a
    // chave de depuração padrão nasce no HOME de quem compila: sem isto, cada runner do CI (e cada
    // máquina) produz uma chave nova e nenhuma rodada instala por cima da anterior. Este é o keystore
    // de depuração padrão do Android — alias androiddebugkey, senha android, CN=Android Debug — que
    // é público por definição; não é segredo e não serve para publicar, só para depurar.
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild.cmake {
        path "CMakeLists.txt"
    }
    androidResources { noCompress += ['task'] }
    namespace = 'com.nextvr.cardboard'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
    // TFLite runtime MediaPipe's HandLandmarker executes on (libtensorflowlite_jni.so). It is NOT the
    // YOLO interpreter: it must stay even though the YOLO pose model was removed.
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Android Mobile Vision - used by the Cardboard SDK to read viewer QR codes.
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.19.4'
    implementation project(":sdk")
}

// The dependencies for NDK builds live inside the .aar files so they need to
// be extracted before NDK targets can link against.
task extractNdk {
    dependsOn ':sdk:assembleRelease'
    doLast {
        copy {
            from zipTree("${project.rootDir}/sdk/build/outputs/aar/sdk-release.aar")
            into "libraries/"
            include "jni/**/libGfxPluginCardboard.so"
        }
        copy {
            from "${project.rootDir}/sdk/include/cardboard.h"
            into "libraries/"
        }
    }
}

task deleteNdk(type: Delete) {
    delete "libraries/jni"
    delete "libraries/cardboard.h"
}

preBuild.dependsOn(extractNdk)
clean.dependsOn(deleteNdk)
