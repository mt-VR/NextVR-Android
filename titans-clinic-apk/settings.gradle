// Projeto standalone do APK do jogo "Clínica dos Titãs" (WebView).
// Build: ./gradlew -p titans-clinic-apk assembleRelease
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'titans-clinic-apk'
