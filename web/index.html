<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Next VR</title>

<link rel="stylesheet" href="./fonts.css">
<style>
  :root{
    --ink:#f2f4f8; --soft:#aab3c2; --faint:#6f7a8c;
    --glass:rgba(24,22,34,.82); --glass-2:rgba(34,31,46,.92);
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.19);
    --accent:#a78bfa; --accent-2:#7c6bff; --good:#8de6c8; --bad:#ff6b6b;
    --r-win:22px; --r-card:16px; --r-ctl:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070c;overscroll-behavior:none}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .joycon-selected{outline:3px solid #67e8f9!important;outline-offset:3px;box-shadow:0 0 0 6px rgba(103,232,249,.22),0 0 20px rgba(103,232,249,.4)!important}
  .ui-icon{display:block;width:1.35em;height:1.35em;pointer-events:none}
  .icon-label{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  [hidden]{display:none!important}

  /* ---------- camadas (ordem importa) ---------- */
  #gl{position:fixed;inset:0;z-index:1}                 /* ambiente 3D */
  #css3d{position:fixed;inset:0;z-index:2}              /* janelas = DOM real em 3D */
  #css3d>div{pointer-events:none}                       /* só o conteúdo recebe toque */
  #overlay{position:fixed;inset:0;z-index:3;pointer-events:none} /* MÃOS POR CIMA DE TUDO */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none}
  #hud>*{pointer-events:auto}

  /* ---------- janela 3D ---------- */
  /* shell sem overflow: a alça branca fica FORA da janela, embaixo, como no print */
  .win-shell{position:relative;pointer-events:auto}
  .win-handle{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);
    width:210px;height:10px;border-radius:99px;background:rgba(255,255,255,.9);
    box-shadow:0 2px 14px rgba(0,0,0,.5);cursor:grab;pointer-events:auto;transition:width .16s,background .16s}
  .win-shell.free .win-handle{width:150px;background:rgba(255,255,255,.65)}
  .win-shell.moving .win-handle{width:260px;background:#fff}
  .win-resize{position:absolute;right:-22px;bottom:-22px;width:56px;height:56px;border-radius:0;
    display:block;z-index:4;pointer-events:auto;cursor:nwse-resize;
    border-right:3px solid rgba(124,107,255,.75);border-bottom:3px solid rgba(124,107,255,.75);
    background:transparent;transition:border-color .16s}
  .win-resize:hover{border-color:#c9b4ff}
  .win-resize .ui-icon{display:none}
  .win-shell.resizing .win-resize{border-color:#fff;transform:scale(1.08)}
  .win-shell.resizing .win{border-color:rgba(167,139,250,.8);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 3px rgba(167,139,250,.28)}
  .win.immersive{border:0;background:#0a0a0c;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 60px 200px rgba(0,0,0,.6);padding-top:54px;border-radius:10px;overflow:hidden}
  .immersive-toolbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 14px;z-index:5;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);pointer-events:none}
  .immersive-toolbar .it-btn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(0,0,0,.4);color:#dfe3ec;backdrop-filter:blur(8px);display:grid;place-items:center;
    transition:background .15s,transform .15s;padding:0}
  .immersive-toolbar .it-btn:hover{background:rgba(0,0,0,.6);transform:scale(1.06)}
  .immersive-toolbar .it-btn:active{transform:scale(.92)}
  .immersive-toolbar .it-btn svg{width:20px;height:20px;display:block}
  .win.immersive.light{background:#fff}
  .win.immersive.light .immersive-toolbar{background:linear-gradient(180deg,rgba(255,255,255,.28),transparent)}
  .win.immersive.light .immersive-toolbar .it-btn{background:rgba(255,255,255,.25);color:#222}
  .win{width:1280px;height:820px;background:var(--glass);border:1px solid var(--line);
    border-radius:0;overflow:hidden;display:flex;flex-direction:column;
    backdrop-filter:blur(18px);box-shadow:0 40px 120px rgba(0,0,0,.55);pointer-events:auto;
    transition:border-color .18s,box-shadow .18s}
  .win.focus{border-color:rgba(155,186,255,.55);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(155,186,255,.28)}
  .win-bar{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;
    background:var(--glass-2);border-bottom:1px solid var(--line)}
  .win-grip{width:38px;height:6px;border-radius:99px;background:rgba(255,255,255,.22);flex:none;cursor:grab}
  .win-title{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .win-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.07);font-size:19px}
  .win-btn.wide{width:auto;min-width:66px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:700}
  .win-btn.wide[aria-pressed="true"]{background:rgba(167,139,250,.42);color:#fff;box-shadow:0 0 0 1px rgba(167,139,250,.5)}
  .win-btn .ui-icon{width:22px;height:22px}
  .win-btn:active{background:rgba(255,255,255,.2)}
  .win-btn.close{background:rgba(255,80,80,.16);color:#ff8f8f}
  .win-btn.close:active{background:#e5484d;color:#fff}
  .win-body{flex:1;min-height:0;position:relative;background:#11151d}
  .win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  /* External pages use a slim bottom rail: the page and URL field keep the top of the window. */
  .web-page-window .win-bar{order:2;height:38px;gap:8px;padding:0 10px;background:rgba(24,22,34,.96);
    border-top:1px solid var(--line);border-bottom:0}
  .web-page-window .win-body{order:1}
  .web-page-window .win-grip{width:28px;height:4px}
  .web-page-window .win-title{font-size:15px}
  .web-page-window .win-btn{width:32px;height:32px;border-radius:9px}
  .web-page-window .win-btn .ui-icon{width:17px;height:17px}
  .web-page-window .win-btn.wide{min-width:48px;height:32px;padding:0 9px;border-radius:9px;font-size:12px}

  /* ---------- conteúdos ---------- */
  .pad{padding:26px 30px;overflow-y:auto;height:100%}
  .row{display:flex;align-items:center;gap:12px}
  .fld{flex:1;min-width:0;height:58px;border-radius:999px;background:rgba(255,255,255,.08);
    border:1px solid var(--line-2);padding:0 22px;color:var(--ink);font:500 21px Inter,sans-serif;outline:none}
  .fld::placeholder{color:var(--faint)}
  .go{height:58px;min-width:58px;padding:0 22px;border-radius:999px;background:var(--accent);color:#10182b;font-weight:700;font-size:19px;display:grid;place-items:center}
  .go .ui-icon{width:25px;height:25px}
  .go:active{background:#fff}
  /* Browser address strip: compact so the page gets more of the floating window's height. */
  .browser-bar{flex:none;padding:5px 8px;gap:6px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
  .browser-bar .fld{height:42px;padding:0 14px;font-size:16px}
  .browser-bar .go{height:42px;min-width:42px;padding:0 12px;font-size:15px}
  .browser-bar .go .ui-icon{width:19px;height:19px}

  /* ---------- YouTube real ---------- */
  .yt-chips{display:flex;gap:10px;padding:12px 14px 2px;overflow-x:auto;flex:none}
  .yt-chip{flex:none;height:44px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.08);
    border:1px solid var(--line);font-size:16px;font-weight:600}
  .yt-chip:active{background:rgba(255,255,255,.2)}
  .yt-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px}
  .yt-sec{margin:0 2px 12px;font-size:18px;font-weight:700}
  .yt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .yt-card{text-align:left;background:rgba(255,255,255,.045);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;padding:0;display:block}
  .yt-card:active{background:rgba(255,255,255,.12)}
  .yt-thumb{position:relative;aspect-ratio:16/9;background:#000;display:block}
  .yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .yt-dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);padding:3px 8px;
    border-radius:7px;font-size:13px;font-weight:600}
  .yt-dur.live{background:#c00}
  .yt-meta{padding:10px 12px 13px;display:block}
  .yt-t{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .yt-c{font-size:13px;color:var(--soft);margin-top:5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;display:block}
  .yt-skel{background:linear-gradient(100deg,#1c212b 40%,#272e3b 50%,#1c212b 60%);
    background-size:200% 100%;animation:ytp 1.1s linear infinite}
  .yt-skel-l{display:block;height:15px;border-radius:7px;margin:0 0 8px;
    background:linear-gradient(100deg,#1c212b 40%,#272e3b 50%,#1c212b 60%);
    background-size:200% 100%;animation:ytp 1.1s linear infinite}
  .yt-skel-l.short{width:60%}
  @keyframes ytp{to{background-position:-200% 0}}
  .yt-err{text-align:center;padding:60px 20px}
  .yt-err-t{font-size:20px;font-weight:700;margin:14px 0 6px}
  .yt-err-s{color:var(--soft);font-size:15px;margin-bottom:22px;line-height:1.6}
  .yt-player{background:#000}
  .yt-frame{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
  .yt-holder iframe{width:100%;height:100%;border:0;display:block}
  .yt-info{padding:14px 16px 22px;background:#0f0f12}
  .yt-ptitle{font-size:19px;font-weight:700;line-height:1.4}
  .yt-pchan{color:var(--soft);font-size:14px;margin-top:6px}
  .yt-prow{display:flex;gap:10px;margin-top:16px}
  .yt-btn{flex:1;background:rgba(255,255,255,.1);border:1px solid var(--line-2);border-radius:13px;
    padding:15px 10px;font-size:14px;font-weight:800;letter-spacing:.03em;display:grid;place-items:center}
  .yt-btn .ui-icon{width:21px;height:21px}
  .yt-btn:active{background:rgba(255,255,255,.24)}
  h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.4px}
  .sub{margin:0 0 20px;color:var(--soft);font-size:17px;line-height:1.5}
  .sec{margin:26px 0 12px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .card{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;margin-bottom:12px}
  .quick-scenes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px}
  .quick-scene{position:relative;min-height:154px;overflow:hidden;border:1px solid rgba(255,255,255,.15);border-radius:18px;
    background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
    padding:18px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .16s,border-color .16s}
  .quick-scene span{font-size:18px;font-weight:700;text-shadow:0 2px 9px #000}
  .quick-scene small{margin-top:4px;font-size:12px;color:#e0e7f1;text-shadow:0 2px 8px #000}
  .quick-scene[aria-pressed="true"]{border:2px solid #4f8dff;box-shadow:0 0 0 2px rgba(79,141,255,.2),0 12px 30px rgba(0,0,0,.24)}
  .quick-scene:active{transform:scale(.985)}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
  .opt:first-child{border-top:0}
  .opt-l{min-width:0}
  .opt-t{font-size:19px;font-weight:600}
  .opt-d{font-size:14px;color:var(--soft);margin-top:3px;line-height:1.45}
  .sw{width:70px;height:40px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .18s}
  .sw:after{content:'';position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;transition:transform .18s}
  .sw[data-on="1"]{background:var(--accent-2)}
  .sw[data-on="1"]:after{transform:translateX(30px)}
  input[type=range]{width:230px;accent-color:var(--accent)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:17px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#10182b;border-color:transparent}
  .seg-btn{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    font-size:17px;font-weight:600}
  .seg-btn:hover{background:rgba(167,139,250,.2);border-color:var(--accent)}
  .tabs{display:flex;gap:8px;padding:0 0 18px;overflow-x:auto}
  .tabs button{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.07);font-size:17px;font-weight:600;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:#eef1f7;color:#10182b}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .thumb{aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .env{aspect-ratio:16/10;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .env span{position:absolute;left:14px;bottom:12px;font-size:18px;font-weight:700;text-shadow:0 2px 8px #000}
  .env[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
  .env-pano span{background:rgba(8,10,16,.5);border-radius:8px;padding:4px 9px;left:10px;bottom:10px}
  .note{margin-top:18px;font-size:14px;color:var(--faint);line-height:1.6}
  .warn{background:rgba(255,190,80,.1);border:1px solid rgba(255,190,80,.3);color:#ffd79a;
    border-radius:var(--r-card);padding:16px 18px;font-size:16px;line-height:1.55;margin-bottom:16px}
  .big{display:grid;place-items:center;height:100%;text-align:center;padding:40px;gap:18px}

  /* primeira execução: a escolha de idioma fica dentro de uma única janela 3D */
  /* Escolha de idioma com a identidade da referência: cartão claro, idioma atual destacado em cima,
     lista vertical abaixo, ilustração da mão com o controle à direita e o botão continuar.
     Os doze idiomas têm de aparecer DE UMA VEZ, como no print, e a pinça não rola lista. Em vez de
     acertar a altura da linha na mão (que depende da métrica da fonte e da plataforma), as linhas
     DIVIDEM o espaço disponível: `flex:1 1 0` com `min-height:0` dá exatamente um doze avos da lista
     para cada idioma, seja qual for a altura da janela — que, aliás, está presa em 660 px, porque o
     slot de textura de uma janela no atlas nativo tem 980 px de altura com 160 px de margem por
     lado. `line-height` é explícito em cada peça para o texto não crescer dentro da linha. */
  /* ---------- espaço pré-definido ao mover janelas na Dock normal (preto meio transparente, sem azul e sem texto) ---------- */
  .win-drop-slot{pointer-events:none;border-radius:24px;background:rgba(0,0,0,.46);
    border:1.5px solid rgba(255,255,255,.14);
    box-shadow:0 24px 64px rgba(0,0,0,.62),inset 0 0 36px rgba(0,0,0,.55);
    display:grid;place-items:center;transition:background .14s,border-color .14s,box-shadow .14s}
  .win-drop-slot.is-ready{background:rgba(0,0,0,.62);border-style:solid;border-color:rgba(255,255,255,.24);
    box-shadow:0 28px 72px rgba(0,0,0,.76),inset 0 0 42px rgba(0,0,0,.68)}
  .win-drop-slot-inner,.win-drop-slot-badge{display:none!important}

  /* ---------- escolher idioma / onboarding (retrato compacto) ---------- */
  .langwin{height:100%;width:100%;padding:14px 16px 12px;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#1a0b3a 0%,#0d0820 70%);color:#f2f2f5;gap:0}
  .lq-hero{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    padding:4px 4px 10px;gap:6px;flex:none}
  .lq-logo{width:56px;height:56px;object-fit:contain;display:block;
    filter:drop-shadow(0 6px 18px rgba(168,85,247,.55))}
  .lq-logo-sm{width:32px;height:32px;margin:0 auto 4px;display:block;object-fit:contain;
    filter:drop-shadow(0 4px 14px rgba(168,85,247,.6))}
  .lq-pickrow{text-align:center;margin-bottom:6px}
  .lq-welcome{margin:2px 0 0;font-size:19px;line-height:1.1;font-weight:800;letter-spacing:-.02em;color:#fff}
  .lq-tag{margin:0;color:#c9b8f0;font-size:11.5px;line-height:1.25}
  .lq-pick{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:4px 10px;font-size:14px;line-height:1.2;font-weight:600;color:#fff;display:inline-block}
  /* No onboarding (janela de boas-vindas) o hero fica em uma faixa vertical roxa
     à esquerda e as opções de idioma à direita. No slim (janela das Configurações) o
     layout fica em coluna, com o ícone pequeno em cima, porque a janela é mais estreita. */
  .lq-main{flex:1;display:flex;flex-direction:row;gap:10px;min-height:0}
  .lq-main:has(.lq-hero){background:rgba(255,255,255,.03);border-radius:14px;padding:8px;gap:8px;border:1px solid rgba(255,255,255,.08)}
  .lq-hero{width:110px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:12px 10px;border-radius:12px;background:linear-gradient(160deg,#2d1065,#150838);
    border:1px solid rgba(168,85,247,.35);text-align:center}
  .lang-options{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;
    overflow-y:auto;padding-right:2px}
  .lang-option{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;
    border-radius:9px;border:0;background:transparent;color:#e9e9f2;padding:6px 10px;font-size:14px;
    line-height:1.15;cursor:pointer;transition:background .12s;font-weight:500}
  /* All 12 options fit at once without scrolling in both onboarding and slim language windows. */
  .langwin:not(.slim) .lang-option{flex:1 1 0;min-height:26px;padding:3px 8px;font-size:13.5px;line-height:1.15}
  .lang-option[aria-pressed="true"]{background:rgba(168,85,247,.26);font-weight:700;color:#fff}
  .lang-option:hover:not(.soon),.lang-option:focus-visible{background:rgba(255,255,255,.08)}
  .lang-option.soon{color:#77798a;cursor:default}
  .lang-option span{display:flex;align-items:center;gap:8px}
  .lang-option.soon i{font-size:10px;font-style:normal;color:#8a8c9e;text-align:right;max-width:42%;
    padding:2px 6px;background:rgba(255,255,255,.06);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lq-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
  .lang-tracking{font-size:11.5px;color:#9799ab}
  .lq-go{appearance:none;border:0;border-radius:10px;padding:8px 20px;font-size:14px;font-weight:700;
    cursor:pointer;color:#fff;background:linear-gradient(135deg,#a855f7,#6366f1);
    box-shadow:0 6px 18px rgba(139,92,246,.4);transition:transform .08s}
  .lq-go:active{transform:translateY(1px)}
  /* Slim (de dentro de Configurações): retrato compacto, só o ícone pequeno em cima */
  .langwin.slim{background:#15121f;padding:10px 12px 10px}
  .langwin.slim .lang-option{flex:1 1 0;min-height:22px;padding:3px 8px;font-size:13px;line-height:1.12}
  .langwin.slim .lq-foot{margin-top:6px}
  .langwin.slim .lq-go{padding:7px 18px;font-size:13.5px}
  .langwin.slim .lq-main{gap:4px}
  @media(max-width:700px){.langwin{padding:12px 12px}.lang-option{font-size:13.5px}}

  /* ---------- loja (igual ao print) ---------- */
  .st{background:#232327;height:100%;overflow-y:auto;padding:18px 24px 30px;color:#f2f2f5}
  .st-top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .st-logo-img{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 7px #0008)}
  .st-tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
  .st-tab{padding:11px 20px;border-radius:999px;font-size:16px;font-weight:600;color:#cfd3da;white-space:nowrap;flex:none}

  /* ---------- teclado estilo Meta Quest (Screenshot_2026-10-20-19-10-52-394): painel escuro, deitado, números/símbolos sobrescritos ---------- */
  .kb{position:relative;width:1150px;background:linear-gradient(180deg,rgba(32,34,40,.98),rgba(21,23,28,.99));border:1.5px solid rgba(255,255,255,.14);

  /* ---------- dock: painel Horizon OS 2.7 Quest 3S, retangular com cantos arredondados ---------- */
  .dock{position:relative;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;
    align-items:center;gap:6px;width:max-content;padding:6px 8px;border-radius:16px;
    background:linear-gradient(180deg,rgba(54,64,81,.78),rgba(29,37,52,.90)),linear-gradient(180deg,rgba(24,28,36,.96),rgba(15,18,25,.98));
    border:1px solid rgba(214,224,242,.22);
    backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
    box-shadow:0 16px 38px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.38);
    pointer-events:auto;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease}
  html[data-dock-color="black"] .dock,.dock[data-dock-color="black"]{
    background:rgba(4,5,8,.84)!important;border-color:rgba(255,255,255,.16)!important}
  html[data-dock-color="blue"] .dock,.dock[data-dock-color="blue"]{
    background:linear-gradient(180deg,rgba(29,78,216,.84),rgba(15,23,42,.92))!important;border-color:rgba(96,165,250,.46)!important}
  html[data-dock-color="purple"] .dock,.dock[data-dock-color="purple"]{
    background:linear-gradient(180deg,rgba(109,40,217,.84),rgba(24,14,48,.92))!important;border-color:rgba(192,132,252,.46)!important}
  html[data-dock-color="green"] .dock,.dock[data-dock-color="green"]{
    background:linear-gradient(180deg,rgba(5,150,105,.82),rgba(10,30,24,.92))!important;border-color:rgba(52,211,153,.46)!important}
  html[data-dock-color="red"] .dock,.dock[data-dock-color="red"]{
    background:linear-gradient(180deg,rgba(185,28,28,.84),rgba(34,12,16,.92))!important;border-color:rgba(248,113,113,.46)!important}
  html[data-dock-color="glass"] .dock,.dock[data-dock-color="glass"]{
    background:rgba(12,15,22,.40)!important;border-color:rgba(255,255,255,.28)!important}
  .dock button{color:#e7e9ed}
  /* A área de arrasto mantém uma barrinha branca visível logo abaixo da dock. */
  .dock-grab{position:absolute;left:50%;top:calc(100% + 8px);bottom:auto;transform:translateX(-50%);z-index:5;
    width:120px;height:14px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 3px;
    border:0;border-radius:0;background:transparent;color:#fff;cursor:grab;touch-action:none;pointer-events:auto}
  .dock-grab::after{content:"";display:block;width:64px;height:3.5px;border-radius:99px;opacity:.94;
    background:#fff;box-shadow:0 1px 5px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.34);
    transition:width .16s,height .16s,background .16s,box-shadow .16s,opacity .16s}
  .dock-grab:hover::after,.dock-grab:focus-visible::after,
  .dock.grab-armed .dock-grab::after,.dock.moving .dock-grab::after{width:76px;height:4.5px;opacity:1;background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.42),0 2px 6px rgba(0,0,0,.38)}
  .dock.moving .dock-grab{cursor:grabbing}

  .dock-bell-ind{position:relative;width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#e2e8f0;opacity:.92;pointer-events:none}
  .dock-bell-ind svg{width:15px;height:15px}
  .dock-bell-ind::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;
    background:#38bdf8;box-shadow:0 0 4px rgba(56,189,248,.8)}
  .dock-tool{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#d9dce2;
    transition:background .15s,transform .15s}
  .dock-tool svg{width:16px;height:16px}
  .dock-tool[data-id="virtual-environment"]{background:rgba(138,158,192,.18);border-color:rgba(209,222,245,.2);color:#f1f5fd}
  .dock-tool[data-id="virtual-environment"][aria-pressed="true"]{background:rgba(142,165,205,.31);border-color:rgba(224,234,250,.3);color:#fff}
  .dock-status:hover,.dock-tool:hover{background:rgba(255,255,255,.14)}
  .dock-av:hover{filter:brightness(1.1)}
  .dock-av:active,.dock-tool:active,.dock-status:active{transform:scale(.93)}
  .dock-sep{width:1px;height:22px;border-radius:2px;background:rgba(255,255,255,.20);flex:none;margin:0 2px}
  .dock-spacer{width:58px;flex:none}

  /* App shortcuts: ícones Horizon OS 2.7 (v207) quadrados com cantos suaves. */
  .dock-app{position:relative;width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    padding:0;overflow:visible;color:#fff;border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 2px 6px rgba(0,0,0,.32);
    transition:transform .16s,filter .16s,box-shadow .16s}
  .dock-app svg{width:19px;height:19px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
  .dock-app img{width:20px;height:20px;object-fit:contain}
  .dock-app img.dock-hz-img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
  .dock-app:hover,.dock-app.dock-hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 0 0 1px rgba(255,255,255,.22),0 5px 12px rgba(0,0,0,.36)}
  .dock-tool:hover,.dock-tool.dock-hover,.dock-av:hover,.dock-av.dock-hover,.dock-status:hover,.dock-status.dock-hover{transform:translateY(-1px) scale(1.04)}
  .dock button:focus-visible{outline:2px solid rgba(180,205,255,.82);outline-offset:2px}
  .dock-app:active{transform:scale(.92)}
  .dock button.near-press{transform:scale(.9)!important;filter:brightness(1.18)!important}
  .dock-tool.near-press,.dock-av.near-press,.dock-status.near-press{transform:scale(.93)!important}
  .dock-app.near-press{box-shadow:inset 0 1px 0 rgba(255,255,255,.36),0 0 0 2px rgba(185,207,255,.72),0 2px 6px rgba(0,0,0,.28)!important}
  .dock-dot{position:absolute;left:50%;bottom:-5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;
    background:#fff;opacity:0;transform:scale(.4);transition:opacity .16s,transform .16s;pointer-events:none}
  .dock-dot.on{opacity:.9;transform:scale(1)}

  /* Browser chrome remains a compact Quest-style toolbar above the page. */
  /* ---- Quest Browser UI ---- */
  .qb-icn{background:transparent;border:0;color:#cdd5e3;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,transform .1s;padding:0}
  .qb-icn:hover{background:rgba(120,160,220,.22)}
  .qb-icn:active{transform:scale(.88)}
  .qb-icn svg{display:block;width:14px;height:14px}
  .qb-urlfld{flex:1;min-width:0;border:0;border-radius:999px;background:#1a1e29;color:#e9edf4;padding:4px 10px;font-size:11px;font-family:inherit;font-weight:500;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);height:22px;box-sizing:border-box}
  .qb-urlfld:focus{box-shadow:inset 0 0 0 2px rgba(39,232,255,.55)}
  .qb-urlfld::placeholder{color:#798299}
  /* ---- Quest Browser dock (fininha, só perfil+hora/bateria) ---- */
  .qb-dock{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px 6px;background:#0e1117;border-top:1px solid rgba(255,255,255,.06)}
  .qb-dock .dock-av,.qb-dock .dock-status{height:20px}
  /* ---- Meta Quest Browser UI (Screenshot_2026-10-20-18-58-42-214) ---- */
  .qb-mode-badge{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap;color:#f1f5f9;background:#262932;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .qb-mode-badge:hover{background:#313540}
  .qb-tab-x{font-style:normal;opacity:.65;font-size:10px;margin-left:2px}
  .qb-tab-plus{width:22px;height:22px;border-radius:6px;border:0;background:rgba(255,255,255,.06);color:#cbd5e1;font-size:14px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
  .qb-tab-plus:hover{background:rgba(255,255,255,.14);color:#fff}
  .qb-ext-pill{font-size:11px;color:#94a3b8;padding:0 4px;white-space:nowrap;letter-spacing:2px;user-select:none}
  .qb-home-overlay{position:absolute;inset:0;z-index:12;background:#1c1e24;color:#f1f5f9;overflow:hidden;display:flex;flex-direction:column}
  .qb-home-overlay[hidden]{display:none!important}
  .qb-home-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 32px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
  .qb-sec{display:flex;flex-direction:column;gap:9px}
  .qb-sec-head{display:flex;align-items:center;justify-content:space-between}
  .qb-sec-title{font-size:13.5px;font-weight:700;color:#e2e8f0;letter-spacing:-.01em}
  .qb-sec-more{font-size:11.5px;font-weight:600;color:#94a3b8}
  .qb-pop-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
  .qb-pop-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border:0;border-radius:12px;background:transparent;color:#e2e8f0;cursor:pointer;transition:transform .14s,background .14s}
  .qb-pop-item:hover{background:rgba(255,255,255,.07);transform:translateY(-2px)}
  .qb-pop-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.07)}
  .qb-pop-lbl{font-size:10.5px;font-weight:500;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .qb-cont-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .qb-cont-card{display:flex;flex-direction:row;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.06);border-radius:9px;background:#282b33;overflow:hidden;padding:7px 9px;text-align:left;color:#f1f5f9;cursor:pointer;transition:transform .14s,background .14s,border-color .14s}
  .qb-cont-card:hover{transform:translateY(-1px);background:#30343e;border-color:rgba(255,255,255,.18)}
  .qb-cont-ico{width:22px;height:22px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff}
  .qb-cont-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
  .qb-cont-ttl{font-size:10.5px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qb-cont-dom{font-size:9px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qb-ent-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 10px}
  .qb-ent-tile{display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:transparent;padding:0;color:#e2e8f0;cursor:pointer;text-align:left;transition:transform .14s}
  .qb-ent-tile:hover{transform:translateY(-2px) scale(1.02)}
  .qb-ent-card{width:100%;height:74px;border-radius:10px;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.38);overflow:hidden;position:relative}
  .qb-ent-brand{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:100%;padding:0 10px}
  .qb-ent-sp-dot{width:28px;height:28px;border-radius:50%;background:#1ED760;display:grid;place-items:center;flex:none}
  .qb-ent-sp-txt{font-size:19px;font-weight:800;color:#1ED760;letter-spacing:-.03em}
  .qb-ent-ytm-dot{width:26px;height:26px;border-radius:50%;background:#FF0033;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex:none}
  .qb-ent-ytm-txt{font-size:20px;font-weight:800;color:#0f172a;letter-spacing:-.03em}
  .qb-ent-cr{gap:5px}
  .qb-ent-cr-dot{font-size:20px;color:#0a0b0e;font-weight:900;line-height:1}
  .qb-ent-cr-txt{font-size:17px;font-weight:800;color:#0a0b0e;letter-spacing:-.02em}
  .qb-ent-hbo{flex-direction:column;gap:0;line-height:.95}
  .qb-ent-hbo-top{font-size:21px;font-weight:900;color:#ffffff;letter-spacing:.03em}
  .qb-ent-hbo-sub{font-size:17px;font-weight:800;color:#cbd5e1;letter-spacing:-.02em}
  .qb-ent-hulu{font-size:26px;font-weight:900;color:#1CE783;letter-spacing:-.04em;text-transform:lowercase}
  .qb-ent-tubi{font-size:26px;font-weight:900;color:#FDE047;letter-spacing:-.03em}
  .qb-ent-para{flex-direction:column;gap:1px}
  .qb-ent-para-mtn{font-size:14px;color:#fff;line-height:1;opacity:.92}
  .qb-ent-para-txt{font-size:16px;font-weight:800;font-style:italic;color:#ffffff;letter-spacing:-.01em}
  .qb-ent-peacock{font-size:19px;font-weight:800;color:#ffffff;letter-spacing:-.02em;gap:5px}
  .qb-ent-pk-dots{display:inline-flex;flex-direction:column;gap:1.5px}
  .qb-ent-pk-dots i{display:block;width:4px;height:4px;border-radius:50%}
  .qb-ent-twitch{font-size:23px;font-weight:900;color:#ffffff;letter-spacing:.01em;text-shadow:2px 2px 0 #3b0764,-1px -1px 0 #3b0764}
  .qb-ent-espn{font-size:26px;font-weight:900;font-style:italic;color:#ffffff;letter-spacing:.04em}
  .qb-ent-lbl{font-size:11px;font-weight:500;color:#cbd5e1;padding-left:2px}
  .qb-imm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .qb-imm-card{min-height:80px;border-radius:12px;border:1px solid rgba(255,255,255,.12);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;text-align:left;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .14s}
  .qb-imm-card:hover{transform:translateY(-2px)}
  .qb-imm-badge{position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25)}
  .qb-imm-ttl{font-size:13px;font-weight:800}
  .qb-imm-sub{font-size:11px;color:#cbd5e1}
  .qb-dock .dock-av{width:20px;border-radius:50%}
  .qb-dock .dock-av svg{width:11px;height:11px}
  .qb-dock .dock-status{padding:0 6px;gap:4px;border-radius:6px;background:rgba(255,255,255,.04)}
  .qb-dock .dock-time{font-size:10px;font-weight:700;letter-spacing:.1px}
  .qb-dock .dock-wifi svg,.qb-dock .dock-bat svg{width:10px;height:10px}
  .qb-dock .dock-av:hover{filter:brightness(1.15);background:rgba(120,160,220,.28)}
  .qb-dock .dock-status:hover{background:rgba(120,160,220,.2)}

  /* Lançador circular de nove pontos no extremo direito. */
  .dock-launcher{border-radius:50%!important;background:rgba(255,255,255,.12)!important;box-shadow:none;border-color:rgba(255,255,255,.14)}
  .dk-grid{display:grid;grid-template-columns:repeat(3,3px);gap:2.5px}
  .dk-grid i{display:block;width:3px;height:3px;border-radius:50%;background:#f1f5f9}
  @media(max-width:900px){
    .dock{gap:4px;padding:5px 7px;border-radius:14px}
    .dock-av{width:28px;height:28px}.dock-av svg{width:15px;height:15px}
    .dock-status{height:28px;gap:4px;padding:0 6px;font-size:10px}
    .dk-time{font-size:10px}.dk-wifi svg,.dk-bat svg{width:12px;height:12px}.dk-bat{font-size:8px}
    .dock-app{width:30px;height:30px;border-radius:9px}
    .dock-app svg{width:17px;height:17px}.dock-app img{width:18px;height:18px}
  }

  /* ============ mundo 3D jogável (plataforma de jogos nativa) ============ */
  .game-tools{height:100%;padding:20px 22px;display:flex;flex-direction:column;gap:13px;overflow:auto}
  .gt-sec{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .gt-row{display:flex;gap:10px;flex-wrap:wrap}
  .gt-btn{min-height:58px;padding:0 20px;border-radius:16px;background:rgba(255,255,255,.08);
    border:1px solid var(--line);font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
  .gt-btn[aria-pressed="true"]{background:var(--accent);color:#10182b;border-color:transparent}
  .gt-btn.danger{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.4);color:#ffb3b3}
  .gt-btn.primary{flex:1;justify-content:center;background:var(--accent-2);color:#fff;border-color:transparent}
  .gt-colors{gap:12px}
  .gt-color{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
  .gt-color[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}
  .gt-status{font-size:17px;color:var(--soft);line-height:1.5}
  /* Menu do jogo: painel PLANO na frente do usuário (estilo SteamVR), nunca curvo. */
  .game-menu{height:100%;padding:26px;display:flex;flex-direction:column;gap:14px}
  .gm-t{font-size:24px;font-weight:700;margin-bottom:4px}
  .gm-btn{min-height:88px;border-radius:20px;background:rgba(255,255,255,.09);border:1px solid var(--line-2);
    font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
  .gm-btn.danger{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.45);color:#ffc9c9}
  .gm-btn .ui-icon{width:28px;height:28px}
  /* Anel de espera do acorde de duas mãos, preso na cabeça junto com o HUD. */
  #gameRing{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;
    border-radius:50%;display:grid;place-items:center}
  #gameRing span{width:70px;height:70px;border-radius:50%;background:rgba(10,12,18,.72);
    border:1px solid rgba(255,255,255,.2)}
  /* Jogo em andamento: some o chrome (status/permissões), ficam o mundo, o painel e o anel. */
  .game-on #hud>*:not(#gameRing){display:none}
  /* ---------- HUD ---------- */
  #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#05070c;padding:28px}
  .boot-c{width:min(560px,100%);text-align:center}
  .logo{margin-bottom:12px;display:grid;place-items:center}
  .logo img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 18px #0009)}
  .start{margin-top:26px;width:100%;padding:22px;border-radius:18px;background:var(--accent);color:#10182b;font-size:20px;font-weight:800}
  .hint{margin-top:18px;font-size:14px;color:var(--faint);line-height:1.7}
  #perm{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:6;display:flex;gap:10px}
  #perm button{padding:14px 22px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line-2);
    font-size:15px;font-weight:600;backdrop-filter:blur(10px)}
  #toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    z-index:7;max-width:86vw;background:rgba(10,12,18,.94);border:1px solid var(--line-2);
    padding:13px 22px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;text-align:center;pointer-events:none!important}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  /* HUD de status (mãos/giro/fps) — escondido a pedido do usuário pra ficar limpo */
  #stat{display:none !important;position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;z-index:6;display:flex;gap:8px;align-items:center;
    font-size:12px;font-weight:600;color:var(--soft);background:rgba(10,12,18,.6);padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);backdrop-filter:blur(8px)}
  #stat i{width:7px;height:7px;border-radius:50%;background:var(--faint);font-style:normal}
  #stat i.on{background:var(--good)}
  #fps{color:var(--faint)}

  /* Permissões: em modo nativo (VR/headset) os botões não podem ser clicados e
     não fazem sentido aparecerem flutuando no campo de visão. */
  .native #perm{display:none !important}
  html.native,html.native body{background:transparent;width:4096px;height:4096px}
  .native #gl{display:none}
  .native #css3d,.native #atlas{position:absolute;inset:0;width:4096px;height:4096px}
  .native #head-overlay{position:absolute;left:0;top:0;width:1200px;height:800px;overflow:hidden;z-index:5;pointer-events:none}
  .native #head-overlay #hud,.native #head-overlay #overlay,.native #head-overlay #boot{position:absolute}
  .native #head-overlay #overlay{width:1200px;height:800px}
  .native #head-overlay #toast,.native #head-overlay #stat,.native #head-overlay #perm{position:absolute}
  .native [data-native-browser]{touch-action:none}
  .phone-grab-hover .win{outline:2px solid rgba(255,255,255,.9)}
  /* ---------- janelas de apps do Android: barra branca da referência + conteúdo real ---------- */
  .app-window{display:flex;flex-direction:column;height:100%;min-height:0;background:#0d1015}
  .app-bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;
    background:#fff;color:#101319;border-bottom:1px solid rgba(0,0,0,.10)}
  .app-badge{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
    background:rgba(16,19,25,.08);border-radius:999px;padding:5px 11px}
  .app-badge.mirror{background:#ffd9c2}
  .app-bar-spacer{flex:1;min-width:4px}
  .app-key{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(16,19,25,.07);
    display:grid;place-items:center;color:#20242c;transition:background .14s,transform .14s}
  .app-key .ui-icon{width:20px;height:20px}
  .app-key:active{background:rgba(16,19,25,.2);transform:scale(.93)}
  .app-surface{position:relative;flex:1;min-height:0;background:#07090d;overflow:hidden}
  .app-state{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;text-align:center;
    padding:26px;color:#e8ebf1;font-size:16px;font-weight:600;line-height:1.45;
    background:rgba(7,9,13,.86);z-index:2}
  .app-state[hidden]{display:none}
  .app-state[data-state="failed"]{color:#ffb4b4}
  /* The way out of a window that could not be filled: open the app on the phone. */
  .app-state-btn{margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:9px 16px;color:#fff;font-size:13.5px;font-weight:700}
  .app-state-btn:active{background:rgba(255,255,255,.26)}
  .win.app-failed .app-bar{background:#ffe7e7}

  /* contagem de janelas de apps abertas, na dock */
  .dock-badge{position:absolute;top:-5px;right:-5px;z-index:4;min-width:17px;height:17px;padding:0 4px;
    border-radius:999px;background:#57dfa1;color:#052c1a;font-size:10.5px;font-weight:800;
    display:grid;place-items:center;box-shadow:0 2px 7px rgba(0,0,0,.5)}

  /* ---------- app Android dedicado do Shizuku ----------
     A coleção Android só aparece nesta janela, separada da biblioteca interna do NextVR. O tile usa
     o ícone real do PackageManager e cai nas iniciais enquanto o ícone é carregado. */
  .lib-tile.android .lib-cover{background:rgba(255,255,255,.07)}
  /* 52 px: the same box the web apps' logos use in this grid (see .lib-brand img.logo), so an
     installed app and a NextVR app are drawn at the same size next to each other. */
  .lib-app-icon{position:relative;z-index:1;width:52px;height:52px;object-fit:contain;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
  /* O nome nunca aparece sobre o ícone; as iniciais são o que fica no lugar quando ele não veio. */
  .lib-tile.android .lib-brand .nm{display:none}
  .lib-tile.android .lib-cover.noicon .nm{display:inline;position:relative;z-index:1;
    color:rgba(255,255,255,.72);font-size:25px;font-weight:800;letter-spacing:.05em}

  @media(max-width:900px){.android-app-grid{grid-template-columns:repeat(4,minmax(80px,1fr));gap:16px}

  .lib-note,.az-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;

  .az-dot[data-state="ask"]{background:#ffc857;box-shadow:0 0 0 4px rgba(255,200,87,.18)}

  /* PhoneXR runtime: the same dot language, plus the runtime's own states. */

  /* ---------- Menu de Entrada NextVR v2.0.0 (Sem sobreposições em 2D Fullscreen e 3D VR) ---------- */

  .entry-layout{

  /* Os 5 botões inclinados em paralelogramo empilhados seguindo a diagonal sem invadir o palco direito */
  .entry-cards-row{
    flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;width:100%;margin-top:2px;min-height:0
  }
  .entry-card:nth-child(1){margin-left:14px}
  .entry-card:nth-child(2){margin-left:7px}
  .entry-card:nth-child(3){margin-left:0px}

  .entry-card:nth-child(5){margin-left:-14px}
  .entry-card{
    position:relative;width:92%;height:42px;min-height:38px;padding:0 12px;border-radius:0;
    transform:skewX(-12deg);
    background:#05070c;
    border:2px solid #ffffff;
    box-shadow:4px 4px 0 #ffffff;
    color:#ffffff;
    display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    cursor:pointer;text-align:center;box-sizing:border-box;
    transition:transform .1s ease,background .12s ease,color .12s ease,box-shadow .12s ease,border-color .12s ease

  /* Animação de Clique (nextvrClickPop + nextvrRippleWave) e Animação de Escolher (nextvrChoosePulse) */
  @keyframes nextvrClickPop{
    0%{transform:scale(1)}
    38%{transform:scale(.91)}
    76%{transform:scale(1.045)}
    100%{transform:scale(1)}
  }
  @keyframes nextvrChoosePulse{
    0%{transform:scale(1);box-shadow:0 0 0 rgba(56,189,248,0)}
    50%{transform:scale(1.04);box-shadow:0 0 18px rgba(56,189,248,.58)}
    100%{transform:scale(1.02);box-shadow:0 0 14px rgba(56,189,248,.42)}
  }
  @keyframes nextvrRippleWave{
    0%{transform:translate(-50%,-50%) scale(.18);opacity:.78}
    100%{transform:translate(-50%,-50%) scale(2.35);opacity:0}
  }
  button,.d-btn,.spatial-app-tile,.lib-tile,.st-card,.st-tab,.quick-control,.entry-card,.entry-seg-btn,.entry-btn,.entry-store-card,.entry-profile-box{
    position:relative;
    transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,border-color .2s ease,background-color .2s ease,filter .2s ease
  }
  .nextvr-choosing,
  .d-btn:hover,.spatial-app-tile:hover,.lib-tile:hover,.st-card:hover,.quick-control:hover,.entry-seg-btn:hover,.entry-btn:hover{
    animation:nextvrChoosePulse .26s cubic-bezier(.22,1,.36,1) forwards;
    border-color:rgba(56,189,248,.88)!important;
    box-shadow:0 0 16px rgba(56,189,248,.46)!important;
    filter:brightness(1.08)
  }
  .entry-seg-btn.on,.entry-card--active,.st-tab.on{
    animation:nextvrChoosePulse .28s cubic-bezier(.22,1,.36,1)
  }
  .nextvr-clicking{
    animation:nextvrClickPop .28s cubic-bezier(.22,1,.36,1)!important
  }
  .nextvr-click-ripple{
    position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:999px;
    background:radial-gradient(circle,rgba(56,189,248,.65) 0%,rgba(37,99,235,.15) 65%,transparent 100%);
    border:1.5px solid rgba(125,211,252,.85);
    pointer-events:none;z-index:8;
    transform:translate(-50%,-50%) scale(.18);opacity:0
  }
  .nextvr-click-ripple.is-active{
    animation:nextvrRippleWave .32s cubic-bezier(.16,1,.3,1) forwards
  }

  /* ---------- Transição de Carregamento do Ambiente Esfumaçada Subindo de Baixo (Estilo Meta Quest) ---------- */
  @keyframes nextvrSmokeRiseUp{
    0%{transform:translateY(62%) scaleX(1.04);opacity:0}
    15%{opacity:.95}
    75%{opacity:.90}
    100%{transform:translateY(-68%) scaleX(1.12);opacity:0}
  }
  @keyframes nextvrSmokeFloorPulse{
    0%{transform:translateX(-50%) scale(.72);opacity:0}
    25%{transform:translateX(-50%) scale(1);opacity:.88}
    80%{transform:translateX(-50%) scale(1.12);opacity:.65}
    100%{transform:translateX(-50%) scale(1.22);opacity:0}
  }
  @keyframes nextvrIrisOpen{
    0%{clip-path:circle(14% at 50% 50%)}
    100%{clip-path:circle(145% at 50% 50%)}
  }
  .vr-circle-loader{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:9990;
    pointer-events:none;
    overflow:hidden;
  }
  .vr-circle-loader[hidden]{display:none!important}
  .vr-smoke-rise-stage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
  }
  .vr-smoke-floor-pad{
    position:absolute;
    left:50%;
    bottom:-10%;
    width:92%;
    height:36%;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 65%,rgba(248,250,252,.78) 0%,rgba(203,213,225,.48) 38%,rgba(148,163,184,.18) 65%,rgba(15,23,42,0) 82%);
    filter:blur(18px);
    opacity:0;
  }
  .vr-smoke-rise-wave{
    position:absolute;
    left:-12%;
    right:-12%;
    bottom:-25%;
    height:150%;
    background:
      radial-gradient(ellipse 68% 28% at 50% 54%,rgba(255,255,255,.82) 0%,rgba(226,232,240,.54) 44%,rgba(148,163,184,0) 78%),
      radial-gradient(ellipse 46% 24% at 24% 58%,rgba(241,245,249,.68) 0%,rgba(203,213,225,0) 74%),
      radial-gradient(ellipse 46% 24% at 76% 58%,rgba(241,245,249,.68) 0%,rgba(203,213,225,0) 74%),
      linear-gradient(0deg,rgba(15,23,42,.38) 0%,rgba(226,232,240,.65) 46%,rgba(255,255,255,.84) 54%,rgba(255,255,255,0) 72%);
    filter:blur(24px);
    opacity:0;
  }
  .vr-smoke-rise-mist{
    position:absolute;
    left:-8%;
    right:-8%;
    bottom:-18%;
    height:135%;
    background:radial-gradient(ellipse 80% 34% at 50% 50%,rgba(255,255,255,.65) 0%,rgba(203,213,225,.32) 48%,rgba(15,23,42,0) 76%);
    filter:blur(32px);
    opacity:0;
  }
  .vr-circle-loader.active .vr-smoke-floor-pad{
    animation:nextvrSmokeFloorPulse 1.12s cubic-bezier(.22,1,.36,1) forwards;
  }
  .vr-circle-loader.active .vr-smoke-rise-wave{
    animation:nextvrSmokeRiseUp 1.12s cubic-bezier(.20,.88,.32,1) forwards;
  }
  .vr-circle-loader.active .vr-smoke-rise-mist{
    animation:nextvrSmokeRiseUp 1.12s cubic-bezier(.16,.84,.36,1) .05s forwards;
  }
  .vr-circle-ring-svg{
    width:0;
    height:0;
    opacity:0;
    position:absolute;
    pointer-events:none;
  }
  .win-shell.win-circle-reveal .win{
    animation:nextvrIrisOpen .44s cubic-bezier(.22,1,.36,1) both;
  }
  .win-circle-loader{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    pointer-events:none!important;
    z-index:12;
    transition:opacity .18s ease;
  }
  .win-circle-loader.done{
    opacity:0;
    display:none!important;
  }
  .win-circle-svg{
    width:56px;
    height:56px;
    padding:8px;
    border-radius:50%;
    background:rgba(4,8,18,.74);
    border:1px solid rgba(56,189,248,.45);
    box-shadow:0 8px 26px rgba(0,0,0,.65);
  }
  .win-circle-track{
    fill:none;
    stroke:rgba(148,163,184,.25);
    stroke-width:5;
  }
  .win-circle-prog{
    fill:none;
    stroke:#38bdf8;
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:151;
    stroke-dashoffset:36;
    transform-origin:32px 32px;
    animation:nextvrCircleSweep .48s cubic-bezier(.22,1,.36,1) forwards;
  }

  /* ---------- anel de 10 apps: janela sem fundo nenhum ---------- */
  .win-shell[data-window-id="orb-menu"],.win-shell[data-window-id="orb-menu"] .win{
    background:transparent!important;border:none!important;box-shadow:none!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:visible!important}
  .win-shell[data-window-id="orb-menu"] .win-body{background:transparent!important;padding:0;overflow:visible}
  .win-shell[data-window-id="orb-menu"] .win-handle,
  .win-shell[data-window-id="orb-menu"] .win-resize,
  .win-shell[data-window-id="orb-menu"] .win-brightness-bar,
  .win-shell[data-window-id="orb-menu"] .win-predefined-slots,
  .win-shell[data-window-id="orb-menu"] .win-cinema-bar,
  .win-shell[data-window-id="orb-menu"] .win-grab-arc{
    display:none!important;opacity:0!important;pointer-events:none!important}

  /* Com o anel aberto, as OUTRAS janelas recuam para trás do véu: elas não somem (o usuário volta a
     elas ao fechar o anel), mas param de cobrir os apps. Era isto que faltava na captura: o Menu
     Rápido ficava na frente e o anel aparecia atrás dele. As mãos e a dock estão na HUD (#hud z4) e
     não são tocadas por esta regra. */
  html[data-orb-open="1"] .win-shell:not([data-window-id="orb-menu"]){
    opacity:.22;filter:saturate(.55) brightness(.62);pointer-events:none;
    transition:opacity .2s ease,filter .2s ease}
  /* A dock também é HUD: ela recua (fica, mas apagada) para os apps serem o que brilha. */
  html[data-orb-open="1"] .dock{opacity:.38;transition:opacity .2s ease}
  .win-shell{transition:opacity .2s ease,filter .2s ease}

  .orb-host,.orb-root{width:100%;height:100%;background:transparent;user-select:none}
  .orb-root{position:relative;display:flex;flex-direction:column;padding:4px 10px 10px}
  .orb-head{display:flex;align-items:center;gap:14px;height:52px;flex:none;padding:0 6px}
  .orb-title{font-size:24px;font-weight:800;letter-spacing:.22em;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .orb-hint{font-size:15px;font-weight:600;color:rgba(255,255,255,.8);
    text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .orb-close{margin-left:auto;width:52px;height:52px;border-radius:50%;font-size:20px;color:#fff;
    background:rgba(16,16,20,.62);border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(10px);display:grid;place-items:center;transition:transform .14s,background .14s}
  .orb-close:hover{background:rgba(40,40,48,.8);transform:scale(1.06)}
  .orb-close:active{transform:scale(.94)}

  /* O círculo: 3 em cima, 4 no meio, 3 embaixo — os lugares vêm do JS em % desta caixa. */
  .orb-ring{position:relative;flex:1;min-height:0}
  .orb-app{position:absolute;transform:translate(-50%,-50%);
    width:180px;height:180px;border-radius:36px;padding:0;overflow:hidden;
    display:block;color:#fff;border:0;
    /* Os apps se destacam no escuro: aro claro, brilho colorido em volta e sombra funda. */
    box-shadow:0 26px 56px rgba(0,0,0,.72),0 0 0 2px rgba(255,255,255,.58),0 0 42px 4px rgba(125,175,255,.4);
    transition:transform .16s cubic-bezier(.2,.9,.2,1),box-shadow .16s}
  .orb-app img{width:100%;height:100%;object-fit:cover;border-radius:36px;display:block}
  .orb-app:hover{box-shadow:0 30px 64px rgba(0,0,0,.78),0 0 0 3px #fff,0 0 60px 8px rgba(150,195,255,.55);
    transform:translate(-50%,-50%) scale(1.1)}
  .orb-app:active{transform:translate(-50%,-50%) scale(.96)}
  .orb-glyph{display:grid;place-items:center;width:100%;height:100%;border-radius:36px;
    font-size:76px;font-weight:800;color:#fff;
    text-shadow:0 3px 16px rgba(0,0,0,.55)}
  /* Nome dentro do tile, num rodapé escuro: um rótulo pendurado embaixo do tile seria cortado pelo
     recorte da janela (e o atlas nativo só captura a caixa da janela). */
  .orb-label{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 8px;
    font-size:15px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.62) 55%,rgba(0,0,0,.82) 100%)}
  .orb-badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
    background:#22c55e;color:#04240f;font-size:14px;font-weight:900;font-style:normal;
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.55)}
  .orb-app--android{box-shadow:0 26px 56px rgba(0,0,0,.72),0 0 0 2px rgba(34,197,94,.85),
    0 0 42px 4px rgba(34,197,94,.45)}

  /* O centro do anel: "TODOS" abre a biblioteca completa do NextVR. */
  .orb-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:120px;height:120px;border-radius:50%;color:#fff;
    background:radial-gradient(circle at 32% 26%,rgba(80,80,96,.92),rgba(18,18,24,.94));
    border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 44px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:transform .16s,box-shadow .16s}
  .orb-hub:hover{transform:translate(-50%,-50%) scale(1.06);
    box-shadow:0 24px 52px rgba(0,0,0,.66),0 0 0 2px rgba(167,139,250,.55)}
  .orb-hub:active{transform:translate(-50%,-50%) scale(.95)}
  .orb-hub-icon{font-size:30px;line-height:1}
  .orb-hub-label{font-size:12px;font-weight:800;letter-spacing:.12em}

  @media(max-width:900px){
    .orb-app{width:142px;height:142px;border-radius:28px}
    .orb-app img,.orb-glyph{border-radius:28px}
    .orb-glyph{font-size:56px}
    .orb-hub{width:100px;height:100px}
    .orb-label{font-size:12px;padding:10px 6px 5px}
  }
</style>
</head>
<body>

<div id="gl"></div>
<div id="css3d"></div>
<canvas id="overlay"></canvas>

<div id="hud">
  <div id="stat"><i id="dotHand"></i><span id="lblHand">mãos</span><i id="dotGyro"></i><span id="lblGyro">giro</span><span id="fps"></span></div>
  <div id="perm" hidden>
    <button id="btnGyro">Ativar giroscópio</button>
    <button id="btnHand">Ativar mãos</button>
  </div>
</div>

<div id="toast"></div>

<!-- primeira execução: idioma -->
<div id="boot">
  <div class="boot-c">
    <div class="logo"><img src="./icons/nextvr-n.png" alt="NextVR"></div>
    <div id="bootSub" style="color:var(--soft);font-size:16px">Next VR</div>
    <button id="bootGo" class="start">Entrar</button>
    <p class="hint" id="bootHint">
      Aponte o celular para a frente ao entrar. Use o controle Centralizar na dock a qualquer momento.
    </p>
  </div>
</div>


<!-- Shared shell/hosted-page typing engine must load before the application bundle. -->
<script defer src="./typing.js"></script>
<script defer src="./app.js"></script>
</body>
</html>
